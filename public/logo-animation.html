<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Dzota — Magic Draw Logo</title>
<style>
:root{--bg:#030914;--blue:#155eff;--cyan:#41dfff;--gold:#ffc34c;}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;color:#eaf7ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(ellipse at 50% 45%,#112b58 0%,#071328 43%,#02050d 100%);}
.scene{width:min(92vw,82svh,820px);aspect-ratio:1;position:relative;isolation:isolate;}
.ambient{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(26,125,255,.27),rgba(24,95,215,.08) 47%,transparent 72%);filter:blur(26px);animation:ambientPulse 3.8s ease-in-out infinite;}
.logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.972);filter:blur(12px) drop-shadow(0 0 36px rgba(35,158,255,.35));animation:logoReveal 1.18s cubic-bezier(.2,.7,.15,1) 4.12s forwards;}
.trace-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
.ring-trace{fill:none;stroke:url(#ringInk);stroke-width:5.5;stroke-linecap:round;filter:drop-shadow(0 0 5px #39cfff) drop-shadow(0 0 15px rgba(33,113,255,.9));stroke-dasharray:1;stroke-dashoffset:1;animation:ringDraw 1.65s cubic-bezier(.45,.02,.2,1) .15s forwards,traceFade .55s ease 4.68s forwards;}
.trace-path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.97;filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 9px rgba(45,185,255,.65));animation:pathDraw var(--dur) cubic-bezier(.42,.02,.25,1) var(--delay) forwards,traceFade .55s ease 4.72s forwards;}
.cap{filter:drop-shadow(0 0 4px rgba(46,196,255,.9)) drop-shadow(0 0 7px rgba(255,184,55,.32));}
.word,.tag{filter:drop-shadow(0 0 4px rgba(53,200,255,.9)) drop-shadow(0 0 8px rgba(53,200,255,.48));}
.flash{position:absolute;inset:8%;border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:screen;background:linear-gradient(112deg,transparent 37%,rgba(255,255,255,.95) 49%,rgba(61,225,255,.75) 51%,transparent 64%);transform:translateX(-150%) rotate(-9deg);animation:lightSweep 1.1s ease-in-out 4.35s forwards;}
.burst{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 10px 6px #fff,0 0 40px 16px #2abaff,0 0 100px 25px rgba(22,100,255,.45);transform:translate(-50%,-50%) scale(.2);animation:burst 1s ease-out 4.0s forwards;pointer-events:none;}
.specks{position:absolute;inset:4%;pointer-events:none;}
.speck{position:absolute;left:var(--x);top:var(--y);width:3px;height:3px;border-radius:50%;background:#dffaff;box-shadow:0 0 7px 2px #40cfff;opacity:0;animation:spark var(--dur) ease-out var(--delay) infinite;}
.eyebrow{position:fixed;top:clamp(14px,3vh,28px);left:0;right:0;text-align:center;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#9cccf6;opacity:.7;}
.caption{position:fixed;bottom:clamp(78px,10vh,104px);left:0;right:0;text-align:center;font-size:11px;letter-spacing:.22em;color:rgba(185,218,255,.65);text-transform:uppercase;}
.controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 12px;}
button{border:1px solid rgba(139,205,255,.36);background:rgba(8,26,58,.78);backdrop-filter:blur(14px);color:#effaff;padding:11px 17px;border-radius:999px;font-size:13px;font-weight:650;cursor:pointer;transition:background .2s ease,border-color .2s ease,transform .2s ease;}
button:hover{background:rgba(20,68,139,.82);border-color:rgba(88,207,255,.75);transform:translateY(-1px)}
html:fullscreen .controls{opacity:0;pointer-events:none;transition:opacity .25s ease}
@keyframes ringDraw{to{stroke-dashoffset:0}}
@keyframes pathDraw{to{stroke-dashoffset:0}}
@keyframes traceFade{to{opacity:0}}
@keyframes logoReveal{0%{opacity:0;transform:scale(.972);filter:blur(12px) drop-shadow(0 0 36px rgba(35,158,255,.35))}58%{opacity:1;filter:blur(1px) drop-shadow(0 0 32px rgba(35,158,255,.45))}100%{opacity:1;transform:scale(1);filter:blur(0) drop-shadow(0 0 22px rgba(35,158,255,.22))}}
@keyframes lightSweep{0%{opacity:0;transform:translateX(-150%) rotate(-9deg)}20%{opacity:1}100%{opacity:0;transform:translateX(150%) rotate(-9deg)}}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}22%{opacity:.95}100%{opacity:0;transform:translate(-50%,-50%) scale(13)}}
@keyframes spark{0%{opacity:0;transform:translate(0,20px) scale(.1)}22%{opacity:.9}75%{opacity:.65}100%{opacity:0;transform:translate(var(--dx),-38px) scale(0)}}
@keyframes ambientPulse{0%,100%{transform:scale(.96);opacity:.65}50%{transform:scale(1.04);opacity:1}}
body.replay .logo{animation:logoReveal 1.18s cubic-bezier(.2,.7,.15,1) 4.12s forwards;}
@media (max-width:560px){.scene{width:min(96vw,68svh)}.eyebrow{font-size:9px;letter-spacing:.23em}.caption{font-size:9px;letter-spacing:.13em;bottom:80px}button{padding:10px 13px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important}}
</style></head><body>

<script>
const TOTAL=8000; let timers=[];
function replay(){
  timers.forEach(clearTimeout);timers=[];
  document.body.classList.remove('replay');
  const nodes=[...document.querySelectorAll('.scene *')];
  nodes.forEach(n=>{n.style.animation='none';});
  void document.getElementById('scene').offsetWidth;
  nodes.forEach(n=>{n.style.animation='';});
  const logo=document.getElementById('logo'); logo.style.animation='none'; void logo.offsetWidth; logo.style.animation='';
}
document.getElementById('replayBtn').addEventListener('click',replay);
document.getElementById('fullBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement) await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){}});
</script></body></html>
