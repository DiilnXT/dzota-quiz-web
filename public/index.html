    <script>
      // Đọc URL param cố gắng update title sớm nhất có thể
      try {
          const params = new URLSearchParams(window.location.search);
          const encodedData = params.get('data');
          if (encodedData) {
              const decoded = JSON.parse(atob(decodeURIComponent(encodedData)));
              if (decoded && decoded.config && decoded.config.title) {
                  document.title = decoded.config.title + " | Dzota";
              }
          }
      } catch(e) {}

      // Đăng ký Service Worker để hỗ trợ mở link và F5 kể cả khi mất kết nối mạng (Offline)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Dzota Offline Service Worker ready:', reg.scope);
          }).catch((err) => {
            console.warn('Dzota Service Worker error:', err);
          });
        });
      }
    </script>

    <!-- Async Dynamic Loader: Thư viện nặng (Mammoth, Docx, TinyMCE) chỉ tải khi người dùng vào soạn đề -->
    <script>
      window.__scriptLoaders = window.__scriptLoaders || {};
      window.loadScriptAsync = function(src) {
        if (window.__scriptLoaders[src]) return window.__scriptLoaders[src];
        window.__scriptLoaders[src] = new Promise(function(resolve, reject) {
          if (document.querySelector('script[src="' + src + '"]')) return resolve();
          var s = document.createElement('script');
          s.src = src;
          s.async = true;
          s.onload = function() { resolve(); };
          s.onerror = function(err) { reject(err); };
          document.head.appendChild(s);
        });
        return window.__scriptLoaders[src];
      };
    </script>

                  /* ========================================================
         APPLE IPHONE 18 LIQUID GLASS - HIGH-PERFORMANCE EDITION
         Ultra-Refined Optical Gloss, Specular Highlights, 120FPS Smooth
         ======================================================== */
      .apple-liquid-glass {
        position: relative;
        content-visibility: auto;
        contain-intrinsic-size: auto 230px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.22) 50%, rgba(255, 255, 255, 0.12) 100%);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.75);
        box-shadow: 
          0 12px 32px -8px rgba(0, 0, 0, 0.1),
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.9),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.03);
        border-radius: 20px;
        transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
        transform: translateZ(0);
      }
      
      @media (max-width: 639px) {
        .apple-liquid-glass {
          -webkit-backdrop-filter: blur(8px);
          backdrop-filter: blur(8px);
          border-radius: 16px;
        }
      }

      @media (min-width: 640px) {
        .apple-liquid-glass {
          border-radius: 26px;
        }
      }
      
      /* Hairline glass specular reflection sheen at top rim */
      .apple-liquid-glass::before {
        content: '';
        position: absolute;
        top: 0;
        left: 10%;
        right: 10%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
        pointer-events: none;
      }
      
      /* Flagged question: Apple Solar Amber Liquid Glass Aura */
      .apple-liquid-glass-flagged {
        background: linear-gradient(135deg, rgba(254, 243, 199, 0.65) 0%, rgba(253, 230, 138, 0.35) 50%, rgba(249, 115, 22, 0.25) 100%) !important;

          0 16px 36px -8px rgba(245, 158, 11, 0.35),
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.95),
          inset 0 -1px 2px 0 rgba(217, 119, 6, 0.2) !important;
      }

      // Wrap Icons with Proxy so undefined icon names gracefully render instead of crashing React
      const Icons = new Proxy(BaseIcons, {

      // --- UI COMPONENTS ---
      const ToastContainer = ({ toasts, removeToast }) => {

      const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
          if (!isOpen) return null;

      const Button = ({ children, onClick, variant = 'primary', className = '', icon, disabled, loading, title }) => {
          const baseStyle = "relative inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-1 active:scale-95 disabled:opacity-60 disabled:pointer-events-none";
          const variants = {
              primary: "bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-600/20 focus:ring-indigo-600",
              secondary: "bg-white hover:bg-gray-50 text-gray-700 border border-gray-200 shadow-sm focus:ring-gray-200",
              danger: "bg-rose-500 hover:bg-rose-600 text-white shadow-lg shadow-rose-500/20 focus:ring-rose-500",
              success: "bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg shadow-emerald-600/20 focus:ring-emerald-600",
              ghost: "text-gray-500 hover:text-gray-800 hover:bg-gray-100/50",
              dark: "bg-slate-800 hover:bg-slate-900 text-white shadow-lg shadow-slate-800/20",
              outline: "bg-transparent border border-indigo-600 text-indigo-600 hover:bg-indigo-50"
          };
          const classes = className || '';
          if(classes.includes("ios-override")) {
             variants.primary = "bg-ios-blue hover:bg-blue-600 text-white shadow-ios-sm";
             variants.success = "bg-ios-green hover:bg-green-600 text-white shadow-ios-sm";
          }
          return (
              <button onClick={onClick} disabled={disabled || loading} className={`${baseStyle} ${variants[variant]} ${classes}`} title={title}>
                  {loading && <div className="spinner border-2"></div>}
                  {!loading && icon && <span>{icon}</span>}
                  <span>{children}</span>
              </button>
          );
      };

      const katexHtmlCache = new Map();
      const MathText = React.memo(({ text }) => {
          if (!text || typeof text !== 'string') return text || null;
          // Fast-path: 95% câu hỏi/phương án không chứa công thức LaTeX, render thẳng text không tốn CPU
          if (!text.includes('$')) return <span>{text}</span>;
          if (!window.katex) return <span>{text}</span>;

          const cached = katexHtmlCache.get(text);
          if (cached !== undefined) {
              return <span className="math-text-wrapper" dangerouslySetInnerHTML={{ __html: cached }} />;
          }

          try {
              const parts = text.split(/(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g);
              let compiledHtml = '';
              for (let i = 0; i < parts.length; i++) {
                  const part = parts[i];
                  if (part.startsWith('$$') && part.endsWith('$$')) {
                      compiledHtml += window.katex.renderToString(part.slice(2, -2), { displayMode: true, throwOnError: false });
                  } else if (part.startsWith('$') && part.endsWith('$')) {
                      compiledHtml += window.katex.renderToString(part.slice(1, -1), { displayMode: false, throwOnError: false });
                  } else {
                      compiledHtml += part.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                  }
              }
              if (katexHtmlCache.size > 2000) katexHtmlCache.clear();
              katexHtmlCache.set(text, compiledHtml);
              return <span className="math-text-wrapper" dangerouslySetInnerHTML={{ __html: compiledHtml }} />;
          } catch (e) {
              return <span>{text}</span>;
          }
      });

      // --- CUSTOM SELECT (DROPDOWN) ---

              return () => document.removeEventListener('mousedown', handleClick);

      // --- MAIN COMPONENT ---
      function App() {

        // Chuyển cấu trúc DOM từ TinyMCE sang danh sách các dòng văn bản kèm thông tin Style (bold, color, underline) & Ảnh
        const parseDomToLines = (rootNode) => {
            let lines = [];
            let currentLine = { text: "", segments: [], images: [] };
            const flushLine = () => {
                if (currentLine.text.trim().length > 0 || currentLine.images.length > 0) {
                    lines.push(currentLine);
                }
                currentLine = { text: "", segments: [], images: [] };
            };
            const isBlock = (node) => ['DIV', 'P', 'LI', 'BR', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'TR'].includes(node.nodeName);

            const walk = (node) => {
                if (node.nodeName === 'IMG') {
                    if (node.src) currentLine.images.push(getDirectImageUrl(node.src));
                } else if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent.replace(/\u00A0/g, ' ');
                    if (text.length === 0) return;
                    let isBold = false;
                    let isUnderline = false;
                    let detectedColor = '';
                    let parent = node.parentElement;
                    while(parent && parent !== rootNode) {
                        const style = (parent.getAttribute('style') || '').toLowerCase();
                        if (parent.tagName === 'B' || parent.tagName === 'STRONG' || 
                            style.includes('font-weight: bold') || style.includes('font-weight: 700') || 
                            style.includes('font-weight: 800') || style.includes('font-weight: 900')) {
                            isBold = true;
                        }
                        if (parent.tagName === 'U' || style.includes('text-decoration: underline') || style.includes('text-decoration-line: underline')) {
                            isUnderline = true;
                        }
                        if (!detectedColor) {
                            const colorMatch = style.match(/(?:^|;\s*)color\s*:\s*([^;]+)/i);
                            if (colorMatch && isNonDefaultColor(colorMatch[1])) {
                                detectedColor = colorMatch[1].trim().toLowerCase();
                            } else if (parent.getAttribute('color') && isNonDefaultColor(parent.getAttribute('color'))) {
                                detectedColor = parent.getAttribute('color').trim().toLowerCase();
                            }
                        }
                        parent = parent.parentElement;
                    }

                    currentLine.text += text;
                    currentLine.segments.push({
                        text: text,
                        bold: isBold,
                        underline: isUnderline,
                        color: detectedColor
                    });
                } else if (node.nodeName === 'BR') {
                    flushLine();
                } else {
                    const isBlk = isBlock(node);
                    if (isBlk) flushLine();
                    for (let i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
                    if (isBlk) flushLine();
                }
            };
            walk(rootNode);
            flushLine();
            return lines;
        };

        // Nhận diện linh hoạt tiêu đề câu hỏi: Câu 1:, Câu 1., 1., [Nội dung câu 1], [Câu 1: ...], Bài 1: ...
        const extractQuestionHeader = (lineText, optMatch, currentCounter) => {
            if (optMatch) return null;
            const trimmed = (lineText || '').trim();
            if (!trimmed) return null;
            if (/^[-*_]{3,}$/.test(trimmed)) return null;

            // 1. Dạng chuẩn: Câu 1: [Nội dung câu 1], Câu 1. [Nội dung câu 1], Bài 1: ..., [Câu 1: Nội dung]
            let m = trimmed.match(/^(?:#{1,6}\s*)?(?:\*\*)?(?:\[\s*)?(?:Câu|Bài)\s*(\d+)[\s.:\]*-]+(.*)$/i);
            if (m) {
                let qNum = m[1];
                let qText = (m[2] || '').trim().replace(/^\*\*/, '').replace(/\*\*$/, '').replace(/\]$/, '').trim();
                if (/^\[(.*)\]$/.test(qText) && !qText.includes('][') && !qText.includes('],[')) {
                    qText = qText.replace(/^\[\s*/, '').replace(/\s*\]$/, '').trim();
                }
                return { number: qNum, text: qText };
            }

            // 2. Dạng số đứng đầu: 1. [Nội dung câu 1], 1: [Nội dung câu 1], 1. Nội dung, 1/ Nội dung, [1] Nội dung
            m = trimmed.match(/^(?:#{1,6}\s*)?(?:\[\s*)?(\d+)[\s.:)\/*\]-]+(?!\s*[A-G][\s.):\/*])(.*)$/i);
            if (m) {
                let qNum = m[1];
                let qText = (m[2] || '').trim().replace(/^\*\*/, '').replace(/\*\*$/, '').replace(/\]$/, '').trim();
                if (/^\[(.*)\]$/.test(qText) && !qText.includes('][') && !qText.includes('],[')) {
                    qText = qText.replace(/^\[\s*/, '').replace(/\s*\]$/, '').trim();
                }
                return { number: qNum, text: qText };
            }

            // 3. Dạng đứng trực tiếp trong ngoặc vuông: [Nội dung câu 1] hoặc [Nội dung câu hỏi...]
            m = trimmed.match(/^\[\s*(.*?)\s*\]$/);
            if (m && m[1].length > 2) {
                const inner = m[1].trim();
                const numInBracket = inner.match(/(?:câu|bài)\s*(\d+)/i) || inner.match(/^(\d+)[\s.:]+/);
                const qNum = numInBracket ? numInBracket[1] : String((currentCounter || 0) + 1);
                let qText = inner;
                if (numInBracket) {
                    qText = inner.replace(/(?:\[\s*)?(?:Câu|Bài)\s*\d+[\s.:\]*-]*/i, '').replace(/^\d+[\s.:\/*-]+/, '').trim();
                }
                return { number: qNum, text: qText || inner };
            }

            return null;
        };

        // Nhận diện dòng phương án A. B. C. D. (hỗ trợ cả *A, **A, (A), [A], - A...)
        const extractOptionMatch = (lineText) => {
            if (!lineText) return null;
            return lineText.match(/^[-*•~]?\s*(?:\*\*)?(?:\[|\()?\s*([A-G])\s*(?:\]|\))?[\s.):\/*-]+(?:\*\*)?\s*(.*)$/i);
        };

        // Kiểm tra toàn diện các thuộc tính của phương án: in đậm chữ cái đầu / toàn bộ, tô màu, gạch chân, dấu sao
        const checkOptionAttributes = (lineObj, label, optContent, formatMode) => {
            const lineText = (lineObj.text || '').trim();
            const segments = lineObj.segments || [];

            // a. Toàn bộ dòng/phương án in đậm
            const isLineWrappedInBold = (lineText.startsWith('**') && lineText.endsWith('**') && lineText.length > 4) ||
                                        (lineText.startsWith('__') && lineText.endsWith('__') && lineText.length > 4);
            // b. Chữ cái đầu in đậm: **A.**, **A**, <b>A.</b>, hoặc segment chứa A. có bold=true
            const isLetterBoldInText = /^\s*[*_]{2}\s*[A-G]/i.test(lineText) ||
                                       /^\s*[*_]{1,2}\s*[A-G]\s*[*_]{1,2}[\s.):\/*]+/i.test(lineText);
            const hasBoldLetterSeg = segments.some(seg => seg.bold && /^[A-G][\s.):\/*]*/i.test(seg.text.trim()));
            // c. Nội dung phương án in đậm
            const hasBoldContentSeg = segments.some(seg => seg.bold && (
                seg.text.replace(/^[A-G][\s.):\/*]*/i, '').trim().length > 0 ||
                (optContent && optContent.includes(seg.text.trim()) && seg.text.trim().length > 0)
            ));
            const isContentBoldInText = /^\s*[-*•~]?\s*(?:\*\*)?[A-G][\s.):\/*]+(?:\*\*)?\s*[*_]{2}(.*?)[*_]{2}\s*$/i.test(lineText);

            const isBold = isLineWrappedInBold || isLetterBoldInText || hasBoldLetterSeg || hasBoldContentSeg || isContentBoldInText;

            // d. Tô màu chữ khác biệt
            let detectedColor = '';
            for (let seg of segments) {
                if (seg.color && isNonDefaultColor(seg.color)) {
                    detectedColor = seg.color;
                    break;
                }
            }
            const hasColor = Boolean(detectedColor);

            // e. Gạch chân
            const isUnderline = segments.some(seg => seg.underline) || /<u>/i.test(lineText);

            // f. Tiền tố dấu sao *A
            const hasAsterisk = /^\s*\*+\s*[A-G]/i.test(lineText) || lineText.startsWith('*');

            // g. Thẻ tường minh: (đúng), [x], (đáp án đúng)
            const hasExplicitTag = /\((?:đúng|đáp án đúng|chính xác|correct|true)\)|\[x\]/i.test(lineText);

            return {
                label,
                isBold,
                hasBoldLetter: isLetterBoldInText || hasBoldLetterSeg,
                isLineWrappedInBold,
                hasColor,
                color: detectedColor,
                isUnderline,
                hasAsterisk,
                hasExplicitTag
            };
        };

        // Quyết định đáp án đúng cho câu hỏi dựa trên bộ chọn định dạng thông minh và các tín hiệu nhận diện
        const finalizeQuestion = (q, optAttrsMap, formatMode, answerMap) => {
            if (!q) return;
            const qNum = String(q.number);
            const optKeys = Object.keys(q.options).filter(k => q.options[k] && q.options[k].trim());
            if (optKeys.length === 0) return;

            // 1. Chế độ Bảng đáp án ở cuối đề
            if (formatMode === 'key_table') {
                if (answerMap && (answerMap[qNum] || answerMap[q.rawKey])) {
                    q.correct = answerMap[qNum] || answerMap[q.rawKey];
                }
                return;
            }

            // 2. Chế độ Chỉ nhận diện Đáp án In Đậm
            if (formatMode === 'bold') {
                const boldKey = optKeys.find(k => optAttrsMap[k]?.isBold);
                if (boldKey) q.correct = boldKey;
                else if (answerMap && answerMap[qNum]) q.correct = answerMap[qNum];
                return;
            }

            // 3. Chế độ Chỉ nhận diện Tô Màu Chữ
            if (formatMode === 'color') {
                const coloredKey = optKeys.find(k => optAttrsMap[k]?.hasColor);
                if (coloredKey) q.correct = coloredKey;
                else if (answerMap && answerMap[qNum]) q.correct = answerMap[qNum];
                return;
            }

            // 4. Chế độ Chỉ nhận diện Gạch Chân
            if (formatMode === 'underline') {
                const uKey = optKeys.find(k => optAttrsMap[k]?.isUnderline);
                if (uKey) q.correct = uKey;
                else if (answerMap && answerMap[qNum]) q.correct = answerMap[qNum];
                return;
            }

            // 5. Chế độ Chỉ nhận diện Dấu Sao (*A, *B...)
            if (formatMode === 'asterisk') {
                const astKey = optKeys.find(k => optAttrsMap[k]?.hasAsterisk);
                if (astKey) q.correct = astKey;
                else if (answerMap && answerMap[qNum]) q.correct = answerMap[qNum];
                return;
            }

            // 6. Chế độ 'auto' (hoặc 'bracket'): Kết hợp thông minh đa tiêu chí theo thứ tự ưu tiên chuẩn
            // Ưu tiên 1: Thẻ tường minh (đúng) hoặc [x]
            const tagKey = optKeys.find(k => optAttrsMap[k]?.hasExplicitTag);
            if (tagKey) { q.correct = tagKey; return; }

            // Ưu tiên 2: Tiền tố dấu sao *A.
            const astKey = optKeys.find(k => optAttrsMap[k]?.hasAsterisk);
            if (astKey) { q.correct = astKey; return; }

            // Ưu tiên 3: Phương án có màu chữ khác biệt so với các phương án còn lại (Đỏ, Xanh...)
            const coloredKeys = optKeys.filter(k => optAttrsMap[k]?.hasColor);
            if (coloredKeys.length === 1) {
                q.correct = coloredKeys[0];
                return;
            } else if (coloredKeys.length > 1 && coloredKeys.length < optKeys.length) {
                const colorCounts = {};
                optKeys.forEach(k => {
                    const col = optAttrsMap[k]?.color || 'default';
                    colorCounts[col] = (colorCounts[col] || 0) + 1;
                });
                const majorityCol = Object.keys(colorCounts).sort((a, b) => colorCounts[b] - colorCounts[a])[0];
                const minorityKey = optKeys.find(k => (optAttrsMap[k]?.color || 'default') !== majorityCol && optAttrsMap[k]?.hasColor);
                if (minorityKey) {
                    q.correct = minorityKey;
                    return;
                }
            }

            // Ưu tiên 4: Gạch chân (Underline)
            const uKeys = optKeys.filter(k => optAttrsMap[k]?.isUnderline);
            if (uKeys.length === 1) {
                q.correct = uKeys[0];
                return;
            }

            // Ưu tiên 5: In đậm (Toàn bộ phương án hoặc Chữ cái đầu A. B. C. D.)
            const boldKeys = optKeys.filter(k => optAttrsMap[k]?.isBold);
            if (boldKeys.length === 1) {
                q.correct = boldKeys[0];
                return;
            }

            // Ưu tiên 6: Bảng đáp án cuối đề
            if (answerMap && (answerMap[qNum] || answerMap[q.rawKey])) {
                q.correct = answerMap[qNum] || answerMap[q.rawKey];
                return;
            }
        };

        // Thuật toán chuẩn hóa đề thi Dzota sang Rich-Text Word & TinyMCE
        const processDzotaTextCore = (rawText) => {
          if (!rawText || !rawText.trim()) return '';
          let text = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          const lines = text.split('\n');

          // Quét bảng đáp án ở cuối văn bản nếu có
          const globalKeyMap = {};
          try {
            const keyMatch = text.match(/(?:^|\n)(?:Đáp án|Bảng đáp án|Answer Key|Key)[:\s]*([\s\S]*)$/i);
            if (keyMatch) {
              const keySection = keyMatch[1];
              const keyRegex = /(?:Câu\s*)?(\d+)[\s.:-]+([A-G])/gi;
              let m;
              while ((m = keyRegex.exec(keySection)) !== null) {
                globalKeyMap[m[1]] = m[2].toUpperCase();
              }
            }
          } catch (e) {
            console.warn('Key table parse failed:', e);
          }

          const processedQuestions = [];
          let currentQuestion = null;
          let qCounter = 0;

          const flushCurrent = () => {
            if (!currentQuestion) return;
            processedQuestions.push(currentQuestion);
            currentQuestion = null;
          };

          for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;
            if (/^[-*_]{3,}$/.test(line)) continue;

            const optMatch = extractOptionMatch(line);
            const qMatch = extractQuestionHeader(line, optMatch, qCounter);
            const ansMatch = line.match(/(?:^|[>*•\s])(?:Đáp án(?: đúng)?|Chọn(?: đáp án)?|Answer Key|Key)[\s.:*]+([A-G])(?:\*|\b|\.|$)/i);
            const expMatch = line.match(/(?:^|[>*•\s])(?:Lời giải|Giải thích|Hướng dẫn giải)[\s.:*]+(.*)$/i);

            if (qMatch && !optMatch) {
              flushCurrent();
              qCounter++;
              const qNum = qMatch.number || qCounter;
              let qContent = qMatch.text;
              currentQuestion = {
                number: qNum,
                text: qContent,
                options: {},
                correct: globalKeyMap[qNum] || null,
                explanation: ''
              };
            } else if (ansMatch && currentQuestion) {
              currentQuestion.correct = ansMatch[1].toUpperCase();
            } else if (expMatch && currentQuestion) {
              currentQuestion.explanation = expMatch[1].trim();
            } else if (optMatch && currentQuestion) {
              const letter = optMatch[1].toUpperCase();

              // Nhận diện xem phương án này có được in đậm (Markdown **) hoặc đánh dấu đúng không
              const isLineWrappedInBold = (line.startsWith('**') && line.endsWith('**') && line.length > 4) ||
                                          (line.startsWith('__') && line.endsWith('__') && line.length > 4);
              const isLetterBolded = /^\s*[*_]{2}\s*[A-G]/i.test(line) ||
                                     /^\s*[*_]{1,2}\s*[A-G]\s*[*_]{1,2}[\s.):\/*]+/i.test(line);
              const isPrefixBolded = /^\s*[*_]{2}\s*[A-G]/i.test(line);
              const isContentBolded = /^\s*[-*•~]?\s*(?:\*\*)?[A-G][\s.):\/*]+(?:\*\*)?\s*[*_]{2}(.*?)[*_]{2}\s*$/i.test(line);
              const hasAsterisk = /^\s*\*+\s*[A-G]/i.test(line) || line.startsWith('*');
              const hasExplicitCorrectTag = /\((?:đúng|đáp án đúng|chính xác|correct|true)\)|\[x\]/i.test(line);

              if (isLineWrappedInBold || isLetterBolded || isPrefixBolded || isContentBolded || hasAsterisk || hasExplicitCorrectTag) {
                currentQuestion.correct = letter;
              }

              let rawOptContent = optMatch[2] || '';
              let optContent = rawOptContent.trim();
              if (isLineWrappedInBold) {
                optContent = optContent.replace(/\*\*$/, '').replace(/__$/, '').trim();
              }
              optContent = optContent.replace(/\s*\((?:đúng|đáp án đúng|chính xác|correct|true)\)/i, '').replace(/\s*\[x\]/i, '').trim();

              currentQuestion.options[letter] = optContent;
            } else if (currentQuestion) {
              // Kiểm tra xem dòng có chứa nhiều phương án trên 1 dòng không (vd: A. ... B. ... C. ... D. ...)
              const optLetters = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
              const optIndices = [];
              optLetters.forEach(ltr => {
                const reg = new RegExp(`(?:^|\\s)(?:[*_]{0,2})(${ltr})[\\s.):/\\*-]+(?:[*_]{0,2})`, 'gi');
                let m;
                while ((m = reg.exec(line)) !== null) {
                  optIndices.push({ letter: ltr, index: m.index, matchLen: m[0].length });
                }
              });

              if (optIndices.length >= 2) {
                optIndices.sort((a, b) => a.index - b.index);
                for (let idx = 0; idx < optIndices.length; idx++) {
                  const curr = optIndices[idx];
                  const startPos = curr.index + curr.matchLen;
                  const endPos = (idx + 1 < optIndices.length) ? optIndices[idx + 1].index : line.length;
                  const chunk = line.substring(curr.index, endPos).trim();

                  const isChunkBold = /^\s*[*_]{2}/.test(chunk) ||
                                      chunk.endsWith('**') ||
                                      chunk.startsWith('*') ||
                                      /\((?:đúng|đáp án đúng|chính xác|correct|true)\)/i.test(chunk);
                  if (isChunkBold) {
                    currentQuestion.correct = curr.letter;
                  }

                  let content = line.substring(startPos, endPos).trim().replace(/^\*\*/, '').replace(/\*\*$/, '');
                  content = content.replace(/\s*\((?:đúng|đáp án đúng|chính xác|correct|true)\)/i, '').replace(/\s*\[x\]/i, '').trim();
                  currentQuestion.options[curr.letter] = content;
                }
              } else {
                const lastOptKey = ['G', 'F', 'E', 'D', 'C', 'B', 'A'].find(k => currentQuestion.options[k] !== undefined);
                if (lastOptKey) {
                  currentQuestion.options[lastOptKey] += ' ' + line;
                } else if (currentQuestion.explanation) {
                  currentQuestion.explanation += ' ' + line;
                } else {
                  currentQuestion.text += ' ' + line;
                }
              }
            } else {
              qCounter++;
              currentQuestion = {
                number: qCounter,
                text: line,
                options: {},
                correct: null,
                explanation: ''
              };
            }
          }
          flushCurrent();

          if (processedQuestions.length === 0) {
            return lines.map(l => `<p>${cleanInlineMarkdown(l)}</p>`).join('');
          }

          let outputHtml = '';
          processedQuestions.forEach(q => {
            const formattedQText = cleanInlineMarkdown(q.text);
            outputHtml += `<p><b>Câu ${q.number}:</b> ${formattedQText}</p>`;

            ['A', 'B', 'C', 'D', 'E', 'F', 'G'].forEach(key => {
              if (q.options[key] !== undefined) {
                const optText = cleanInlineMarkdown(q.options[key]);
                const isCorrect = q.correct === key;
                if (isCorrect) {
                  outputHtml += `<p><b style="color: #e11d48;">${key}. ${optText}</b></p>`;
                } else {
                  outputHtml += `<p><b>${key}.</b> ${optText}</p>`;
                }
              }
            });

            if (q.explanation) {
              const expText = cleanInlineMarkdown(q.explanation);
              outputHtml += `<p style="color: #475569; font-style: italic;"><i>Lời giải: ${expText}</i></p>`;
            }

            outputHtml += `<p><br></p>`;
          });

          return outputHtml;
        };

        const handleProcessDzotaText = () => {
          try {
            if (!dzotaInputText || !dzotaInputText.trim()) {
              addToast('Vui lòng dán văn bản Markdown vào khung Dữ liệu đầu vào.', 'error');
              return;
            }
            const html = processDzotaTextCore(dzotaInputText);
            setDzotaPreviewHtml(html);
            addToast('Đã chuẩn hóa định dạng chuẩn Word & TinyMCE thành công!', 'success');
          } catch (err) {
            console.error('Lỗi khi chuẩn hóa Dzota:', err);
            addToast('Có lỗi khi xử lý định dạng: ' + (err.message || 'Lỗi không xác định'), 'error');
          }
        };

        const clearDzotaInput = () => {
          setDzotaInputText('');
          setDzotaPreviewHtml('');
          const box = document.getElementById('dzota-preview-box');
          if (box) box.innerHTML = '';
          addToast('Đã xóa sạch nội dung.', 'info');
        };

        const copyDzotaToWord = async () => {
          const box = document.getElementById('dzota-preview-box');
          const htmlContent = box ? box.innerHTML : dzotaPreviewHtml;
          const textContent = box ? box.innerText : '';
          if (!htmlContent || !textContent.trim()) {
            addToast('Chưa có nội dung để sao chép. Vui lòng bấm "Xử lý định dạng ngay".', 'info');
            return;
          }

          try {
            if (navigator.clipboard && window.ClipboardItem) {
              const styledHtml = `<div style="font-family:'Times New Roman',Times,serif;font-size:14pt;line-height:1.5;">${htmlContent}</div>`;
              const blobHtml = new Blob([styledHtml], { type: 'text/html' });
              const blobText = new Blob([textContent], { type: 'text/plain' });
              await navigator.clipboard.write([
                new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })
              ]);
            } else {
              const ta = document.createElement('textarea');
              ta.value = textContent;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
            }
            addToast('Đã sao chép Rich-Text chuẩn Word thành công! Bạn có thể dán vào Word hoặc trình soạn thảo.', 'success');
          } catch (err) {
            console.error('Copy failed:', err);
            addToast('Không thể sao chép tự động. Hãy bôi đen văn bản và ấn Ctrl+C.', 'error');
          }
        };

        const applyDzotaToEditor = () => {
          const box = document.getElementById('dzota-preview-box');
          const htmlContent = box ? box.innerHTML : dzotaPreviewHtml;
          if (!htmlContent || !(box ? box.innerText.trim() : '')) {
            addToast('Chưa có nội dung để chèn. Vui lòng bấm "Xử lý định dạng ngay".', 'info');
            return;
          }

          const targetEditor = (window.tinymce && window.tinymce.get('batch-bank-editor-area'))
            || (window.tinymce && window.tinymce.get('slot-quiz-editor-area')) 
            || (window.tinymce && window.tinymce.get('quiz-editor-area'));

          if (targetEditor) {
            targetEditor.setContent(htmlContent);
            setShowDzotaModal(false);
            addToast('Đã chèn nội dung vào khung soạn thảo! Bạn có thể bấm "Bước 2" để phân tích.', 'success');
          } else {
            addToast('Khung soạn thảo đề chưa sẵn sàng.', 'error');
          }
        };

        window.clearDzotaInput = clearDzotaInput;
        window.processDzotaText = handleProcessDzotaText;
        window.copyDzotaToWord = copyDzotaToWord;

        const handlePasteSampleQuizToEditor = () => {
            const sampleHtml = `
<p><b>[NB] Cho phương trình $x^2 - 4x + 3 = 0$. Tập nghiệm của phương trình là:</b></p>
<p><strong>A.</strong> $S = \\{1; 3\\}$</p>
<p><b>B.</b> $S = \\{-1; -3\\}$</p>
<p><b>C.</b> $S = \\{1; -3\\}$</p>
<p><b>D.</b> $S = \\{-1; 3\\}$</p>
<p><br></p>
<p><b>Câu 2. [Nội dung câu 2] Tìm giá trị lớn nhất của hàm số $y = -x^2 + 2x + 1$ trên đoạn $[0; 2]$:</b></p>
<p>A. $\\max y = 1$</p>
<p><strong>B. $\\max y = 2$</strong></p>
<p>C. $\\max y = 3$</p>
<p>D. $\\max y = 0$</p>
<p><br></p>

                                                    isActive: true
                                                }
                                            };
                                            recoveredList.push(restoredBank);
                                            knownIds.add(bId);
                                            if (lowerTitle) knownTitles.add(lowerTitle);
                                            if (isViSinhName) foundViSinh = true;
                                        }
                                    }
                                }
                            });
                        }
                    } catch (e) {}
                }

                if (recoveredList.length > 0) {
                    const nextAll = [...recoveredList, ...curSaved];
                    try { localStorage.setItem('myQuizzes', JSON.stringify(nextAll)); } catch (e) {}
                    
                    const nextVault = [...recoveredList, ...vault.filter(v => !knownIds.has(v.id))];

        const fetchQuizzes = async (scope = adminScope) => {
            try {
                const url = `/api/quick-quiz?id=all${isUserAdmin ? `&filter=${scope}` : ''}`;
                const serverRes = await fetch(url);
                if (serverRes.ok) {
                    const serverQuizzes = await serverRes.json();
                    if (Array.isArray(serverQuizzes)) {
                        // MERGE AN TOÀN TUYỆT ĐỐI - KHÔNG BAO GIỜ XÓA ĐỀ HAY NGÂN HÀNG TRÊN MÁY LOCAL
                        let localQuizzes = [];
                        try { localQuizzes = JSON.parse(localStorage.getItem('myQuizzes') || '[]'); } catch (e) {}
                        let vaultBanks = [];
                        try { vaultBanks = JSON.parse(localStorage.getItem('dzota_bank_vault') || '[]'); } catch (e) {}

                        const serverIdSet = new Set(serverQuizzes.map(sq => sq.id));
                        const map = new Map();
                        // 1. Chỉ giữ local quizzes nếu là bản nháp chưa lưu (draft) HOẶC còn tồn tại trên server
                        // Loại bỏ hoàn toàn các đề thi đã bị xóa trên server để đồng bộ chuẩn xác với Dashboard
                        localQuizzes.forEach(q => {
                            if (!q || !q.id) return;
                            const isDraft = q.id.startsWith('draft_') || q.isLocalDraft === true;
                            if (isDraft || serverIdSet.has(q.id)) {
                                map.set(q.id, q);
                            } else {
                                try { localStorage.removeItem('dzota_offline_quiz_' + q.id); } catch (e) {}
                            }
                        });
                        // 2. Giữ ngân hàng từ Vault độc lập (nếu là bản nháp hoặc còn tồn tại trên server)
                        vaultBanks.forEach(b => {
                            if (!b || !b.id) return;
                            const isDraft = b.id.startsWith('draft_') || b.id.startsWith('bank_draft_') || b.isLocalDraft === true;
                            if (isDraft || serverIdSet.has(b.id)) {
                                map.set(b.id, b);
                            }
                        });
                        // 3. Cập nhật dữ liệu từ server (nguồn dữ liệu chính xác)
                        serverQuizzes.forEach(sq => {
                            if (sq && sq.id) {
                                const localItem = map.get(sq.id);
                                if (localItem && localItem.config?.quizType === 'bank' && (localItem.questions?.length || 0) >= (sq.questions?.length || 0)) {
                                    map.set(sq.id, { ...sq, ...localItem });
                                } else {
                                    map.set(sq.id, sq);
                                }
                            }
                        });

                        const merged = Array.from(map.values());
                        setSavedQuizzes(merged);
                        try { localStorage.setItem('myQuizzes', JSON.stringify(merged)); } catch (e) {}
                    }
                }
            } catch (err) {
                console.warn('Could not sync quizzes from server:', err);

          // 2. Khi đã nộp bài ở màn hình kết quả -> poll để cập nhật bảng vinh danh các đối thủ khác nộp bài
          if (appMode === 'result' && isBattleMode && currentBattleRoom) {
            const pollInterval = setInterval(async () => {
              try {
                const res = await fetch(`/api/battle?roomId=${currentBattleRoom.id}`);
                if (res.ok) {
                  const data = await res.json();
                  if (data.success && data.room) {
                    setCurrentBattleRoom(prevRoom => {
                      if (!prevRoom) return data.room;
                      // Giữ lại kết quả đã nộp nếu local đã có kết quả
                      const mergedPlayers = (data.room.players || []).map(srvP => {
                        const localP = (prevRoom.players || []).find(p => p.id === srvP.id || (p.name && srvP.name && p.name.trim().toLowerCase() === srvP.name.trim().toLowerCase()));
                        if (localP && localP.submitted && !srvP.submitted) {
                          return { ...srvP, ...localP };
                        }
                        return srvP;
                      });
                      mergedPlayers.sort((a, b) => {
                        if (!a.submitted && !b.submitted) return 0;
                        if (!a.submitted) return 1;
                        if (!b.submitted) return -1;
                        if ((b.score ?? 0) !== (a.score ?? 0)) return (b.score ?? 0) - (a.score ?? 0);
                        return (a.durationSeconds ?? 0) - (b.durationSeconds ?? 0);
                      });
                      const mergedRoom = {
                        ...data.room,
                        players: mergedPlayers,
                        completedAt: data.room.completedAt || prevRoom.completedAt || Date.now()
                      };
                      saveLocalBattleHistory(mergedRoom);
                      return mergedRoom;
                    });

            if (!Array.isArray(list)) list = [];
            const idx = list.findIndex(r => r.id === room.id);
            if (idx >= 0) {
              list[idx] = { ...list[idx], ...room };
            } else {
              list.unshift(room);
            }
            const threeDaysAgo = Date.now() - 3 * 24 * 60 * 60 * 1000;
            list = list.filter(r => (r.completedAt || r.createdAt || Date.now()) > threeDaysAgo);

        const fetchBattleHistory = async () => {
          const targetQuizId = quizIdTracker || 'all';

          try {
            const res = await fetch(`/api/battle?quizId=${targetQuizId}&history=true`);
            if (res.ok) {
              const data = await res.json();
              if (data.success && Array.isArray(data.history)) {
                serverList = data.history;
              }
            }
          } catch(e) {}

          let localList = [];
          try {
            const raw = localStorage.getItem('dzota_my_battles');
            if (raw) {
              const twoHoursAgo = Date.now() - 2 * 60 * 60 * 1000;
              localList = (JSON.parse(raw) || []).filter(r => (r.completedAt || r.createdAt || Date.now()) > twoHoursAgo);
            }
          } catch(e) {}

          const mergedMap = new Map();
          localList.forEach(r => mergedMap.set(r.id, r));
          serverList.forEach(r => {
            const existing = mergedMap.get(r.id);
            if (!existing || (r.players && r.players.some(p => p.submitted))) {
              mergedMap.set(r.id, r);
            }
          });
          const merged = Array.from(mergedMap.values()).sort((a, b) => (b.completedAt || b.createdAt || 0) - (a.completedAt || a.createdAt || 0));

            const variant = { ...slot.variants[vIdx] };
            if (field.startsWith('option_')) {
                const optKey = field.split('_')[1];
                variant.options = { ...variant.options, [optKey]: value };
            } else if (field === 'correct' || field === 'text') {
                variant[field] = value;
            }
            slot.variants[vIdx] = variant;
            updated[slotIdx] = slot;
            setBankSlots(updated);
        };

            const updated = [...bankSlots];

            slot.variants = slot.variants.filter((_, i) => i !== vIdx);
            const slotNum = slotIdx + 1;
            slot.variants = slot.variants.map((v, i) => ({ ...v, id: `${slotNum}.${i + 1}` }));
            updated[slotIdx] = slot;

                text: '',

        // --- XUẤT FILE WORD (.DOCX) CHUẨN, ĐẸP, FONT TIMES NEW ROMAN, IN ĐẬM ĐÁP ÁN ĐẦY ĐỦ ---
        const handleExportDocx = async (item) => {
            if (!item) {
                addToast("Không tìm thấy dữ liệu đề thi để xuất!", "error");
                return;
            }

            if (!window.docx) {
                try {
                    addToast("Đang chuẩn bị thư viện xuất Word...", "info");
                    if (window.loadScriptAsync) {
                        await window.loadScriptAsync('/docx.umd.cjs');
                    }
                } catch(e) {}
            }

            if (!window.docx) {
                addToast("Không thể tải thư viện Word, vui lòng kiểm tra kết nối mạng!", "error");
                return;
            }

            const { Document, Paragraph, TextRun, Table, TableRow, TableCell, AlignmentType, WidthType, BorderStyle, Packer } = window.docx;

            const cleanText = (str) => {
                if (!str) return '';
                let t = str.toString();
                t = t.replace(/<br\s*[\/]?>/gi, '\n');
                t = t.replace(/<\/p>/gi, '\n');
                t = t.replace(/<[^>]+>/g, '');
                t = t.replace(/&nbsp;/g, ' ')
                     .replace(/&amp;/g, '&')
                     .replace(/&lt;/g, '<')
                     .replace(/&gt;/g, '>')
                     .replace(/&quot;/g, '"')
                     .replace(/&#39;/g, "'");
                return t.trim();
            };

            const createTextRuns = (rawText, isBold = false, fontSize = 24, fontColor = '000000') => {
                const text = cleanText(rawText);
                const lines = text.split('\n');
                const runs = [];
                lines.forEach((line, idx) => {
                    if (idx > 0) runs.push(new TextRun({ break: 1 }));
                    runs.push(new TextRun({
                        text: line,
                        bold: isBold,
                        size: fontSize,
                        font: 'Times New Roman',
                        color: fontColor
                    }));
                });
                return runs;
            };

            const isBank = item.config?.quizType === 'bank' || (item.questions && item.questions.length > 0 && Array.isArray(item.questions[0]?.variants));

            try {
                addToast("⏳ Đang khởi tạo file Word (.docx) chuẩn...", "info");

                const thinBorder = { style: BorderStyle.SINGLE, size: 4, color: '888888' };
                const cellBorders = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
                const noneBorder = { style: BorderStyle.NONE };
                const transparentBorders = { top: noneBorder, bottom: noneBorder, left: noneBorder, right: noneBorder };

                const children = [];
                const answerKey = [];

                if (isBank) {
                    // --- XUẤT TOÀN BỘ NGÂN HÀNG CÂU HỎI (1.1, 1.2... 2.1, 2.2...) ---
                    const slots = item.questions || [];
                    let totalSubQ = 0;
                    slots.forEach(s => {
                        const vars = s.variants || (s.text ? [s] : []);
                        totalSubQ += vars.length;
                    });

                    // Tiêu đề đầu trang 2 cột chuẩn văn bản
                    children.push(new Table({
                        width: { size: 100, type: WidthType.PERCENTAGE },
                        rows: [
                            new TableRow({
                                children: [
                                    new TableCell({
                                        borders: transparentBorders,
                                        width: { size: 45, type: WidthType.PERCENTAGE },
                                        children: [
                                            new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: 'HỆ THỐNG NGÂN HÀNG ĐỀ DZOTA', bold: true, size: 20, font: 'Times New Roman' })], spacing: { after: 20 } }),
                                            new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: 'NGÂN HÀNG CÂU HỎI CHUẨN HÓA', bold: true, size: 20, font: 'Times New Roman' })], spacing: { after: 20 } }),
                                            new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: 'Mã NH: ' + (item.id ? item.id.substring(0, 8).toUpperCase() : 'BANK'), size: 19, font: 'Times New Roman' })] })
                                        ]
                                    }),
                                    new TableCell({
                                        borders: transparentBorders,
                                        width: { size: 55, type: WidthType.PERCENTAGE },
                                        children: [
                                            new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: (item.title || 'Ngân Hàng Đề').toUpperCase(), bold: true, size: 24, font: 'Times New Roman' })], spacing: { after: 20 } }),
                                            new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: 'Môn học: ' + (item.config?.category || item.category || 'Chung'), bold: true, size: 20, font: 'Times New Roman' })], spacing: { after: 20 } }),
                                            new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: `Quy mô: ${slots.length} câu lớn (${totalSubQ} câu hỏi con)`, size: 19, font: 'Times New Roman' })], spacing: { after: 20 } }),
                                            new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: '(Các câu hỏi được phân cấp: 1.1, 1.2... 2.1, 2.2...)', italics: true, size: 18, font: 'Times New Roman' })] })

                                ]
                            })
                        ]

                    children.push(new Paragraph({
                        alignment: AlignmentType.CENTER,
                        children: [new TextRun({ text: '----------------------------------------------------------------------------------------------------', color: '888888', font: 'Times New Roman' })],
                        spacing: { before: 80, after: 120 }
                    }));

                    // Duyệt từng nhóm câu hỏi lớn (Câu 1, Câu 2...) và các biến thể con (1.1, 1.2...)

                                            new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: (item.title || 'Bài Kiểm Tra').toUpperCase(), bold: true, size: 22, font: 'Times New Roman' })], spacing: { after: 20 } }),

                 optLetters.forEach(ltr => {
                   const reg = new RegExp(`(?:^|\\s)(?:[*_]{0,2})(${ltr})[\\s.):/\\*-]+(?:[*_]{0,2})`, 'gi');
                   let m;
                   while ((m = reg.exec(lineText)) !== null) {
                     optIndices.push({ letter: ltr, index: m.index, matchLen: m[0].length });
                   }
                 });

        // Thuật toán xáo trộn đa chu kỳ với entropy mật mã cao cấp (Siêu ngẫu nhiên - True Crypto Fisher-Yates)
        const shuffleArray = (array) => {
            if (!Array.isArray(array) || array.length <= 1) return [...(array || [])];
            const arr = [...array];
            const getRandomInt = (max) => {
                if (typeof window !== 'undefined' && window.crypto && window.crypto.getRandomValues) {
                    const buf = new Uint32Array(1);
                    window.crypto.getRandomValues(buf);
                    return buf[0] % max;
                }
                return Math.floor(Math.random() * max);
            };
            // 3 chu kỳ xáo trộn liên tục để đạt độ xáo trộn phân bố ngẫu nhiên tối đa
            for (let round = 0; round < 3; round++) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = getRandomInt(i + 1);
                    const temp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = temp;
                }
            }
            return arr;
        };

                      if (remaining <= 0) {
                        setTimeLeft(0);
                        handleSubmitExam();
                      } else {
                        setTimeLeft(remaining);
                      }
                    }
                  }
                } catch(e) {}
              }
            }
          };

          document.addEventListener('visibilitychange', handleVisibility);
          window.addEventListener('pagehide', handleVisibility);
          return () => {
            document.removeEventListener('visibilitychange', handleVisibility);
            window.removeEventListener('pagehide', handleVisibility);
          };
        }, [appMode, submitted, currentQuestions, currentQIndex, userAnswers, showExplanation, timeLeft, quizIdTracker, quizConfig.mode]);

        useEffect(() => {
            const handleKeyDown = (e) => {
              if (appMode !== 'taking' || quizConfig.mode !== 'practice') return;
              const currentQ = currentQuestions[currentQIndex]; if (!currentQ) return;
              const qId = currentQ.id;
              if (['1','2','3','4','5','6','7'].includes(e.key)) { const m = {'1':'A','2':'B','3':'C','4':'D','5':'E','6':'F','7':'G'}; handleSelectAnswer(qId, m[e.key]); }
              if (e.key === 'Enter') { e.preventDefault(); const ans = userAnswers[qId]; if (showExplanation[qId] === 'correct' || (ans === currentQ.correct)) handleNextQuestion(); }
            };
            window.addEventListener('keydown', handleKeyDown); return () => window.removeEventListener('keydown', handleKeyDown);
        }, [appMode, quizConfig.mode, currentQIndex, currentQuestions, userAnswers, showExplanation]);

        const formatTime = (sec) => `${Math.floor(sec / 60)}:${(sec % 60) < 10 ? '0' : ''}${sec % 60}`;

        const handleSelectAnswer = (qId, option) => {
          if (submitted && quizConfig.mode === 'exam') return;
          let currentFirst = { ...firstAttempts };
          if (!isWrongReviewMode) {
            if (currentFirst[qId] === undefined) {
              currentFirst[qId] = option;
              setFirstAttempts(currentFirst);
            }
          }
          const nextAnswers = { ...userAnswers, [qId]: option };
          setUserAnswers(nextAnswers);
          let nextExp = showExplanation;
          if (quizConfig.mode === 'practice') {
              const q = currentQuestions.find(q => q.id === qId);
              if (q) {
                  nextExp = { ...showExplanation, [qId]: q.correct === option ? 'correct' : 'incorrect' };
                  setShowExplanation(nextExp);
                  if (isWrongReviewMode && option === q.correct) {
                      removeSingleWrongQuestion(q);
                      addToast("✨ Tuyệt vời! Trả lời đúng đã loại câu này khỏi danh sách câu sai.", "success");
                  }
              }
          }
          saveSessionProgress({ 
            userAnswers: nextAnswers, 
            showExplanation: nextExp,
            firstAttempts: currentFirst 
          });
        };

        const handleNextQuestion = () => { 
          if (currentQIndex < currentQuestions.length - 1) {
            const nextIdx = currentQIndex + 1;
            setCurrentQIndex(nextIdx);
            saveSessionProgress({ currentQIndex: nextIdx });
          } else { 
            addToast("Hoàn thành!", 'success'); 
            processSubmit(); 
          } 
        };

        const handleRequeue = (offset) => {
            const curQ = currentQuestions[currentQIndex];
            if (!curQ) return;
            
            // Lấy danh sách options hiện có
            const optKeys = ['A', 'B', 'C', 'D', 'E', 'F', 'G'].filter(k => curQ.options && curQ.options[k]);
            const correctText = curQ.options[curQ.correct]; // Nội dung phương án đúng

            // Xáo trộn nội dung các phương án
            const shuffledTexts = optKeys.map(k => curQ.options[k]);
            for (let i = shuffledTexts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = shuffledTexts[i];
                shuffledTexts[i] = shuffledTexts[j];
                shuffledTexts[j] = temp;
            }

            // Gán lại vào các key A, B, C, D và tìm lại key đúng mới
            const newOptions = {};
            let newCorrectKey = curQ.correct;
            optKeys.forEach((key, idx) => {
                newOptions[key] = shuffledTexts[idx];
                if (shuffledTexts[idx] === correctText) {
                    newCorrectKey = key;
                }
            });

            const uniqueReqId = (curQ.originalId || curQ.id) + '_req_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

            const requeuedQ = {
                ...curQ,
                id: uniqueReqId,
                originalId: curQ.originalId || curQ.id,
                options: newOptions,
                correct: newCorrectKey,
                isReview: true
            };

            const newQ = [...currentQuestions];
            newQ.splice(Math.min(newQ.length, currentQIndex + 1 + offset), 0, requeuedQ);
            setCurrentQuestions(newQ);

            // Kế thừa cờ xem lại từ câu hiện tại sang câu requeued
            let nextFlags = flaggedQuestions;
            if (isQuestionFlagged(curQ)) {
                nextFlags = { 
                    ...flaggedQuestions, 
                    [uniqueReqId]: true, 
                    [curQ.id]: true,
                    [requeuedQ.originalId]: true 
                };
                setFlaggedQuestions(nextFlags);
            }

            saveSessionProgress({ currentQuestions: newQ, flaggedQuestions: nextFlags });
            addToast("Đã xáo trộn phương án và thêm câu hỏi vào hàng đợi ôn tập!", 'info');
            handleNextQuestion();
        };

        const handleSubmitExam = () => { if(!submitted) { if (timeLeft > 0) showConfirm("Nộp bài?", "Bạn có chắc muốn nộp bài ngay?", processSubmit); else processSubmit(); } };

        const handleRestartPractice = () => {
            showConfirm(
                "Làm lại từ đầu?",
                "Toàn bộ câu trả lời đã lưu sẽ được làm mới và bạn sẽ bắt đầu lại từ câu số 1. Bạn có chắc muốn làm lại từ đầu không?",
                () => {
                    startQuiz(false);
                    addToast("Đã bắt đầu lại từ đầu bài luyện tập!", 'info');
                }
            );
        };

        const handleSubmitPractice = () => {
            const answeredCount = Object.keys(userAnswers).length;
            const totalCount = currentQuestions.length;
            showConfirm(
                "Nộp bài luyện tập?",
                `Bạn đã làm ${answeredCount}/${totalCount} câu hỏi. Bạn có chắc muốn nộp bài để xem tổng kết điểm và lời giải chi tiết ngay bây giờ không?`,
                () => {
                    processSubmit();
                }
            );
        };

        const processSubmit = () => {
            try {
                const uniqueList = (quizConfig.mode === 'exam' || !uniqueQuestions || uniqueQuestions.length === 0) ? currentQuestions : uniqueQuestions;
                let count = 0;
                uniqueList.forEach(q => {
                    if (quizConfig.mode === 'exam') {
                        if (userAnswers[q.id] === q.correct) {
                            count++;
                        }
                    } else {
                        const studentAns = (firstAttempts[q.id] !== undefined && firstAttempts[q.id] !== null)
                            ? firstAttempts[q.id]
                            : userAnswers[q.id];
                        if (studentAns === q.correct) {
                            count++;
                        }
                    }
                });
                const totalQ = Math.max(1, uniqueList.length);
                const finalScore = parseFloat(((count / totalQ) * 10).toFixed(1));
                setCorrectCount(count); 
                setScore(finalScore);
                setSubmitted(true); 
                setAppMode('result'); 
                addToast("Đã ghi nhận kết quả!", 'success');
                setTimeout(() => {
                    window.scrollTo({ top: 0, behavior: 'instant' });
                    if (typeof document !== 'undefined') {
                        document.documentElement.scrollTop = 0;
                        document.body.scrollTop = 0;
                    }
                }, 60);

                // Cập nhật kết quả lên server Battle nếu đang thi đấu đối kháng
                if (isBattleMode && currentBattleRoom) {
                    const durationSec = Math.max(1, Math.round((Date.now() - (battleStartTime || Date.now())) / 1000));
                    const pName = (battlePlayerName && battlePlayerName.trim()) || (currentUser?.name || currentUser?.username || 'Thí sinh');
                    const pId = currentUser?.id || localStorage.getItem('dzota_battle_pid') || ('p_' + Date.now());

                    // Cập nhật ngay trong local currentBattleRoom để UI phản hồi tức thì
                    if (currentBattleRoom && Array.isArray(currentBattleRoom.players)) {
                        const clonedPlayers = currentBattleRoom.players.map(p => ({ ...p }));
                        let plIndex = clonedPlayers.findIndex(p => p.id === pId);
                        if (plIndex === -1 && pName) {
                            plIndex = clonedPlayers.findIndex(p => p.name && p.name.trim().toLowerCase() === pName.trim().toLowerCase());
                        }
                        if (plIndex === -1) {
                            const curName = (currentUser?.name || currentUser?.username || '').trim().toLowerCase();
                            if (curName) {
                                plIndex = clonedPlayers.findIndex(p => p.name && p.name.trim().toLowerCase() === curName);
                            }
                        }
                        if (plIndex === -1) {
                            const isHostPlayer = clonedPlayers.find(p => p.isHost && (p.id === pId || (p.name && p.name.trim().toLowerCase() === pName.trim().toLowerCase())));
                            if (isHostPlayer) {
                                plIndex = clonedPlayers.indexOf(isHostPlayer);
                            }
                        }
                        if (plIndex === -1) {
                            plIndex = clonedPlayers.findIndex(p => !p.submitted);
                        }
                        if (plIndex === -1 && clonedPlayers.length > 0) plIndex = 0;

                        if (plIndex >= 0 && clonedPlayers[plIndex]) {
                            clonedPlayers[plIndex].submitted = true;
                            clonedPlayers[plIndex].score = finalScore;
                            clonedPlayers[plIndex].correctCount = count;
                            clonedPlayers[plIndex].totalQuestions = uniqueList.length;
                            clonedPlayers[plIndex].durationSeconds = durationSec;
                            clonedPlayers[plIndex].submittedAt = Date.now();
                        }

                        // Sắp xếp thứ hạng ngay lập tức
                        clonedPlayers.sort((a, b) => {
                            if (!a.submitted && !b.submitted) return 0;
                            if (!a.submitted) return 1;
                            if (!b.submitted) return -1;
                            if ((b.score ?? 0) !== (a.score ?? 0)) return (b.score ?? 0) - (a.score ?? 0);
                            return (a.durationSeconds ?? 0) - (b.durationSeconds ?? 0);
                        });

                        const updatedRoomLocal = {
                            ...currentBattleRoom,
                            players: clonedPlayers,
                            completedAt: currentBattleRoom.completedAt || Date.now(),
                            resultExpiresAt: Date.now() + 2 * 60 * 60 * 1000,
                            status: clonedPlayers.every(p => p.submitted) ? 'completed' : currentBattleRoom.status
                        };

                        setCurrentBattleRoom(updatedRoomLocal);
                        saveLocalBattleHistory(updatedRoomLocal);
                    }

                    fetch('/api/battle', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'submit',
                            roomId: currentBattleRoom.id,
                            playerId: pId,
                            playerName: pName,
                            result: {
                                score: finalScore,
                                correctCount: count,
                                totalQuestions: uniqueList.length,
                                durationSeconds: durationSec
                            }
                        })
                    }).then(r => r.json()).then(res => {
                        if (res.success && res.room) {
                            setCurrentBattleRoom(prev => {
                                const mergedPlayers = (res.room.players || []).map(p => {
                                    if (p.submitted) return p;
                                    const localP = prev?.players?.find(lp => lp.id === p.id || lp.name === p.name);
                                    if (localP && localP.submitted) return { ...p, ...localP };
                                    return p;
                                });
                                mergedPlayers.sort((a, b) => {
                                    if (!a.submitted && !b.submitted) return 0;
                                    if (!a.submitted) return 1;
                                    if (!b.submitted) return -1;
                                    if ((b.score ?? 0) !== (a.score ?? 0)) return (b.score ?? 0) - (a.score ?? 0);
                                    return (a.durationSeconds ?? 0) - (b.durationSeconds ?? 0);
                                });
                                const finalRoom = { ...res.room, players: mergedPlayers };
                                saveLocalBattleHistory(finalRoom);
                                return finalRoom;
                            });
                        }
                    }).catch(console.error);
                }

                // Cập nhật ngân hàng câu sai
                const targetQuizId = quizIdTracker || 'default';
                if (!isWrongReviewMode) {
                    // Lượt thi chính thức: RESET MỚI danh sách câu sai theo kết quả của lượt thi này (không cộng dồn câu sai cũ)
                    try {
                        const newWrongList = [];
                        uniqueList.forEach(origQ => {
                            const studentAns = (quizConfig.mode === 'practice' && firstAttempts[origQ.id] !== undefined)
                                ? firstAttempts[origQ.id]
                                : userAnswers[origQ.id];
                            const isSubmittedCorrect = studentAns !== undefined && studentAns !== null && studentAns === origQ.correct;
                            const oid = origQ.originalId || origQ.id || origQ.originalSlotId;

                            if (!isSubmittedCorrect) {
                                newWrongList.push({
                                    id: origQ.id,
                                    originalId: oid,
                                    text: origQ.text,
                                    options: { ...origQ.options },
                                    correct: origQ.correct,
                                    explanation: origQ.explanation || ''
                                });
                            }
                        });

                        localStorage.setItem('dzota_wrong_questions_' + targetQuizId, JSON.stringify(newWrongList));
                        setWrongQuestionsList(newWrongList);
                    } catch(err) {
                        console.error("Lỗi cập nhật danh sách câu sai:", err);
                    }
                } else {
                    // Đang ở chế độ ôn lại câu sai (isWrongReviewMode === true):
                    // Bỏ ra những câu đã làm đúng trong lượt ôn này, giữ lại những câu vẫn làm sai
                    try {
                        let currentWrong = [];
                        try {
                            const raw = localStorage.getItem('dzota_wrong_questions_' + targetQuizId);
                            if (raw) currentWrong = JSON.parse(raw) || [];
                        } catch(e) {}

                        const remainingWrong = currentWrong.filter(wq => {
                            const reviewedQ = uniqueList.find(q => 
                                q.id === wq.id || 
                                (q.originalId && wq.originalId && q.originalId === wq.originalId) ||
                                (q.originalId && q.originalId === wq.id) ||
                                (wq.originalId && wq.originalId === q.id) ||
                                (q.text || '').trim() === (wq.text || '').trim()
                            );
                            if (!reviewedQ) return true; // Chưa làm câu này trong lượt ôn thì giữ lại

                            const studentAns = (quizConfig.mode === 'practice' && firstAttempts[reviewedQ.id] !== undefined)
                                ? firstAttempts[reviewedQ.id]
                                : userAnswers[reviewedQ.id];
                            const isSubmittedCorrect = studentAns !== undefined && studentAns !== null && studentAns === reviewedQ.correct;
                            return !isSubmittedCorrect; // Đúng thì loại bỏ (false), sai thì giữ lại (true)
                        });

                        localStorage.setItem('dzota_wrong_questions_' + targetQuizId, JSON.stringify(remainingWrong));
                        setWrongQuestionsList(remainingWrong);
                        if (remainingWrong.length === 0) {
                            addToast("🎉 Chúc mừng! Bạn đã làm đúng toàn bộ và xóa sạch danh sách câu sai!", "success");
                        } else {
                            addToast(`Đã cập nhật: Còn lại ${remainingWrong.length} câu cần củng cố thêm.`, "info");
                        }
                    } catch(err) {
                        console.error("Lỗi cập nhật danh sách ôn câu sai:", err);
                    }
                }

                try {
                  localStorage.removeItem('dzota_quiz_session_' + (quizIdTracker || 'default'));
                  const qParam = new URLSearchParams(window.location.search).get('id');
                  if (qParam) localStorage.removeItem('dzota_quiz_session_' + qParam);
                } catch(e) {}
                setInProgressSession(null);
                try {
                  const spent = (quizConfig.timeLimit * 60) - (timeLeft || 0);
                  fetch('/api/student/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                      userId: currentUser?.id,
                      userEmail: currentUser?.email,
                      username: currentUser?.username,
                      quizId: quizIdTracker || 'quiz',
                      quizTitle: quizConfig.title || 'Bài thi Dzota',
                      score: finalScore,
                      correctCount: count,
                      totalCount: uniqueList.length,
                      timeSpent: spent > 0 ? spent : 0
                    })
                  }).then(r => r.json()).then(res => {
                    if (res.success) {
                      try {
                        localStorage.setItem('dzota_last_submit_ts', Date.now().toString());
                        window.dispatchEvent(new CustomEvent('dzota_quiz_submitted', { detail: { score: finalScore, quizId: quizIdTracker } }));
                      } catch(e) {}
                    }
                  }).catch(() => {});
                } catch(e) {}
            } catch (err) {
                console.error("Lỗi khi xử lý nộp bài:", err);
                setSubmitted(true);
                setAppMode('result');
            }
        };

        // --- RENDER SECTIONS ---
        const renderHome = () => (
            <div className="min-h-screen pb-12 bg-gray-50">
                <header className="bg-white/80 backdrop-blur-xl border-b border-gray-200/50 sticky top-0 z-[40] pt-safe">

                            <span className="hidden sm:inline-block w-px h-5 bg-gray-200"></span>

                                <h1 className="text-xl font-bold text-gray-900 tracking-tight">Thư viện</h1>

                                        <Icons.User size={12}/> {currentUser.username}{isUserAdmin ? ' (Admin)' : ''}

          // Tìm tất cả các IDs liên quan đến câu hỏi này
          const relatedIds = new Set([qId]);
          if (origId) relatedIds.add(origId);
          if (targetQ && targetQ.originalReviewId) relatedIds.add(targetQ.originalReviewId);
          if (Array.isArray(currentQuestions)) {
            currentQuestions.forEach(cq => {
              if ((origId && (cq.originalId === origId || cq.id === origId)) ||
                  (targetText && (cq.text || '').trim() === targetText)) {
                relatedIds.add(cq.id);
                if (cq.originalId) relatedIds.add(cq.originalId);
              }
            });
          }

          const currentlyFlagged = isQuestionFlagged(targetQ || { id: qId, originalId: origId });

          setFlaggedQuestions(prev => {
            const next = { ...prev };
            if (currentlyFlagged) {
              relatedIds.forEach(id => {
                delete next[id];
              });
            } else {
              relatedIds.forEach(id => {
                next[id] = true;
              });
            }
            saveSessionProgress({ flaggedQuestions: next });
            return next;
