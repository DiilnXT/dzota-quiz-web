        const handleAddVariant = (slotIdx) => {
            const updated = [...parsedQuestions];
            const newVariant = { id: Date.now() + Math.random(), text: '', options: {A:'', B:'', C:'', D:'', E:'', F:'', G:''}, correct: null, images: [] };
            updated[slotIdx] = { ...updated[slotIdx], variants: [...updated[slotIdx].variants, newVariant] };
            setParsedQuestions(updated);
        };

        const handleDeleteVariant = (slotIdx, variantIdx) => {
            const updated = [...parsedQuestions];
            if (updated[slotIdx].variants.length === 1) { handleDeleteSlot(slotIdx); return; }
            updated[slotIdx] = { ...updated[slotIdx], variants: updated[slotIdx].variants.filter((_, i) => i !== variantIdx) };
            setParsedQuestions(updated);
        };

        const handleDeleteSlot = (idx) => {
            showConfirm("Xóa nhóm câu hỏi?", "Bạn muốn xóa nhóm câu hỏi này?", () => {
                setParsedQuestions(parsedQuestions.filter((_, i) => i !== idx)); addToast("Đã xóa nhóm câu hỏi", 'success');
            });
        };

        // --- 4. SAVING LOGIC ---
        const handleSaveToSheet = async () => {
           setIsSaving(true);
           const quizId = quizIdTracker || ('quiz_' + Date.now());
           const quizData = { id: quizId, title: quizConfig.title, config: quizConfig, questions: parsedQuestions, createdAt: new Date().toISOString() };
           
           try {
               const res = await fetch('/api/quick-quiz', {
                   method: 'POST',
                   headers: { 'Content-Type': 'application/json' },
                   body: JSON.stringify(quizData)
               });
               if (!res.ok) throw new Error("Save failed");
               
               const finalUrl = `${window.location.origin}/?id=${quizId}`;
               setGeneratedLink(finalUrl);
               setQuizIdTracker(quizId);
               
               const currentSaved = JSON.parse(localStorage.getItem('myQuizzes') || '[]');
               const updatedSaved = currentSaved.filter(q => q.id !== quizId);
               updatedSaved.unshift(quizData);
               localStorage.setItem('myQuizzes', JSON.stringify(updatedSaved));
               setSavedQuizzes(updatedSaved);
               addToast("Đã lưu lên Vercel Postgres thành công!", 'success');
           } catch(e) {
               addToast("Lỗi kết nối Server: " + e.message, 'error');
           }
           setIsSaving(false);
        };

        // --- 5. TAKING LOGIC ---
        const shuffleArray = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
            return arr;
        };

        
          const handleFileUpload = (e) => {
              const file = e.target.files[0];
              if (!file) return;
              if (!file.name.endsWith('.docx')) {
                  addToast("Chỉ hỗ trợ file Word (.docx)", "error");
                  return;
              }
              const reader = new FileReader();
              reader.onload = (event) => {
                  const arrayBuffer = event.target.result;
                  window.mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
                      .then(function(result) {
                          const html = result.value;
                          if (window.tinymce && window.tinymce.get('quiz-editor-area')) {
                              window.tinymce.get('quiz-editor-area').setContent(html);
                              addToast("Đã nạp nội dung từ file Word!", "success");
                          } else { addToast("Trình soạn thảo chưa sẵn sàng hoặc bị lỗi!", "error"); }
                      })
                      .catch(function(err) {
                          console.error(err);
                          addToast("Lỗi đọc file Word: " + err.message, "error");
                      });
              };
              reader.readAsArrayBuffer(file);
          };

        // Lưu tiến trình bài thi vào localStorage để không bị mất khi thoát app/đa nhiệm
        const saveSessionProgress = (overrides = {}) => {
          if (submitted) return;
          const questionsToSave = overrides.currentQuestions || currentQuestions;
          if (!questionsToSave || questionsToSave.length === 0) return;
          const key = 'dzota_quiz_session_' + (quizIdTracker || 'default');
          const now = Date.now();
          const curTimeLeft = overrides.timeLeft !== undefined ? overrides.timeLeft : timeLeft;
          
          let prevEndTime = null;
          try {
            const raw = localStorage.getItem(key);
            if (raw) {
              const prev = JSON.parse(raw);
              prevEndTime = prev.endTime;
            }
          } catch(e) {}

          const endTime = quizConfig.mode === 'exam' ? (prevEndTime || (now + curTimeLeft * 1000)) : null;

          const sessionData = {
            quizId: quizIdTracker,
            appMode: 'taking',
            currentQuestions: questionsToSave,
            currentQIndex: overrides.currentQIndex !== undefined ? overrides.currentQIndex : currentQIndex,
            userAnswers: overrides.userAnswers || userAnswers,
            showExplanation: overrides.showExplanation || showExplanation,
            timeLeft: curTimeLeft,
            endTime: endTime,
            savedAt: now,
            mode: quizConfig.mode
          };
          try {
            localStorage.setItem(key, JSON.stringify(sessionData));
          } catch(e) {}
        };

        const startQuiz = (resume = false) => {
          if (!resume) {
            if (quizConfig.password && accessPassword !== quizConfig.password) { addToast("Sai mật khẩu!", 'error'); return; }
          }
          
          let finalQuestions = parsedQuestions.map(slot => {
              const variants = slot.variants || []; const picked = variants[Math.floor(Math.random() * variants.length)] || variants[0];
              return { ...picked, originalSlotId: slot.id, options: { ...picked.options } };
          });
          
          if (quizConfig.randomPickCount > 0 && quizConfig.randomPickCount < finalQuestions.length) {
              let idxs = shuffleArray(finalQuestions.map((_, i) => i)).slice(0, quizConfig.randomPickCount);
              if (!quizConfig.shuffleQuestions) idxs.sort((a, b) => a - b);
              finalQuestions = idxs.map(i => finalQuestions[i]);
          } else if (quizConfig.shuffleQuestions) finalQuestions = shuffleArray(finalQuestions);

          if (quizConfig.shuffleOptions) {
             finalQuestions = finalQuestions.map(q => {
               const keys = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
               const contents = keys.map(k => ({ key: k, text: q.options[k] })).filter(o => o.text);
               const shuffled = shuffleArray(contents);
               const newOpts = {}; let newCorrect = null;
               keys.forEach((k, i) => { if (shuffled[i]) { newOpts[k] = shuffled[i].text; if (shuffled[i].key === q.correct) newCorrect = k; } });
               return { ...q, options: newOpts, correct: newCorrect };
             });
          }
          
          setIsWrongReviewMode(false);
          setFirstAttempts({});
          setCurrentQuestions(finalQuestions); setAppMode('taking'); setTimeLeft(quizConfig.timeLimit * 60);
          setSubmitted(false); setScore(0); setUserAnswers({}); setShowExplanation({}); setCurrentQIndex(0);

          const now = Date.now();
          const sessionData = {
            quizId: quizIdTracker,
            appMode: 'taking',
            currentQuestions: finalQuestions,
            currentQIndex: 0,
            userAnswers: {},
            showExplanation: {},
            timeLeft: quizConfig.timeLimit * 60,
            endTime: quizConfig.mode === 'exam' ? (now + quizConfig.timeLimit * 60 * 1000) : null,
            savedAt: now,
            mode: quizConfig.mode
          };
          try {
            localStorage.setItem('dzota_quiz_session_' + (quizIdTracker || 'default'), JSON.stringify(sessionData));
          } catch(e) {}
        };

        useEffect(() => {
          let timer;
          if (appMode === 'taking' && timeLeft > 0 && !submitted && quizConfig.mode === 'exam') {
            timer = setInterval(() => setTimeLeft(p => { if (p <= 1) { handleSubmitExam(); return 0; } return p - 1; }), 1000);
          }
          return () => clearInterval(timer);
        }, [appMode, timeLeft, submitted]);

        // Lắng nghe khi người dùng thoát ra app khác hoặc tắt màn hình điện thoại
        useEffect(() => {
          const handleVisibility = () => {
            if (document.visibilityState === 'hidden') {
              if (appMode === 'taking' && !submitted && currentQuestions.length > 0) {
                saveSessionProgress();
              }
            } else if (document.visibilityState === 'visible') {
              if (appMode === 'taking' && !submitted && quizConfig.mode === 'exam') {
                const key = 'dzota_quiz_session_' + (quizIdTracker || 'default');
                try {
                  const raw = localStorage.getItem(key);
                  if (raw) {
                    const data = JSON.parse(raw);
                    if (data.endTime) {
                      const remaining = Math.round((data.endTime - Date.now()) / 1000);
                      if (remaining <= 0) {
                        setTimeLeft(0);
                        handleSubmitExam();
                      } else {
                        setTimeLeft(remaining);
                      }
                    }
                  }
                } catch(e) {}
              }
            }
          };

          document.addEventListener('visibilitychange', handleVisibility);
          window.addEventListener('pagehide', handleVisibility);
          return () => {
            document.removeEventListener('visibilitychange', handleVisibility);
            window.removeEventListener('pagehide', handleVisibility);
          };
        }, [appMode, submitted, currentQuestions, currentQIndex, userAnswers, showExplanation, timeLeft, quizIdTracker, quizConfig.mode]);

        useEffect(() => {
            const handleKeyDown = (e) => {
              if (appMode !== 'taking' || quizConfig.mode !== 'practice') return;
              const currentQ = currentQuestions[currentQIndex]; if (!currentQ) return;
              const qId = currentQ.id;
              if (['1','2','3','4','5','6','7'].includes(e.key)) { const m = {'1':'A','2':'B','3':'C','4':'D','5':'E','6':'F','7':'G'}; handleSelectAnswer(qId, m[e.key]); }
              if (e.key === 'Enter') { e.preventDefault(); const ans = userAnswers[qId]; if (showExplanation[qId] === 'correct' || (ans === currentQ.correct)) handleNextQuestion(); }
            };
            window.addEventListener('keydown', handleKeyDown); return () => window.removeEventListener('keydown', handleKeyDown);
        }, [appMode, quizConfig.mode, currentQIndex, currentQuestions, userAnswers, showExplanation]);

        const formatTime = (sec) => `${Math.floor(sec / 60)}:${(sec % 60) < 10 ? '0' : ''}${sec % 60}`;

        const handleSelectAnswer = (qId, option) => {
          if (submitted && quizConfig.mode === 'exam') return;
          if (!isWrongReviewMode) {
            setFirstAttempts(prev => {
              if (prev[qId] === undefined) {
                return { ...prev, [qId]: option };
              }
              return prev;
            });
          }
          const nextAnswers = { ...userAnswers, [qId]: option };
          setUserAnswers(nextAnswers);
          let nextExp = showExplanation;
          if (quizConfig.mode === 'practice') {
              const q = currentQuestions.find(q => q.id === qId || (q.originalId || q.id) === qId);
              if (q) {
                  nextExp = { ...showExplanation, [qId]: q.correct === option ? 'correct' : 'incorrect' };
                  setShowExplanation(nextExp);
              }
          }
          saveSessionProgress({ userAnswers: nextAnswers, showExplanation: nextExp });
        };

        const handleNextQuestion = () => { 
          if (currentQIndex < currentQuestions.length - 1) {
            const nextIdx = currentQIndex + 1;
            setCurrentQIndex(nextIdx);
            saveSessionProgress({ currentQIndex: nextIdx });
          } else { 
            addToast("Hoàn thành!", 'success'); 
            processSubmit(); 
          } 
        };

        const handleRequeue = (offset) => {
            const curQ = currentQuestions[currentQIndex];
            if (!curQ) return;
            
            // Lấy danh sách options hiện có
            const optKeys = ['A', 'B', 'C', 'D', 'E', 'F', 'G'].filter(k => curQ.options && curQ.options[k]);
            const correctText = curQ.options[curQ.correct]; // Nội dung phương án đúng

            // Xáo trộn nội dung các phương án
            const shuffledTexts = optKeys.map(k => curQ.options[k]);
            for (let i = shuffledTexts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = shuffledTexts[i];
                shuffledTexts[i] = shuffledTexts[j];
                shuffledTexts[j] = temp;
            }

            // Gán lại vào các key A, B, C, D và tìm lại key đúng mới
            const newOptions = {};
            let newCorrectKey = curQ.correct;
            optKeys.forEach((key, idx) => {
                newOptions[key] = shuffledTexts[idx];
                if (shuffledTexts[idx] === correctText) {
                    newCorrectKey = key;
                }
            });

            const uniqueReqId = (curQ.originalId || curQ.id) + '_req_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

            const requeuedQ = {
                ...curQ,
                id: uniqueReqId,
                originalId: curQ.originalId || curQ.id,
                options: newOptions,
                correct: newCorrectKey,
                isReview: true
            };

            const newQ = [...currentQuestions];
            newQ.splice(Math.min(newQ.length, currentQIndex + 1 + offset), 0, requeuedQ);
            setCurrentQuestions(newQ);
            saveSessionProgress({ currentQuestions: newQ });
            addToast("Đã xáo trộn phương án và thêm câu hỏi vào hàng đợi ôn tập!", 'info');
            handleNextQuestion();
        };

        const handleSubmitExam = () => { if(!submitted) { if (timeLeft > 0) showConfirm("Nộp bài?", "Bạn có chắc muốn nộp bài ngay?", processSubmit); else processSubmit(); } };

        const handleRestartPractice = () => {
            showConfirm(
                "Làm lại từ đầu?",
                "Toàn bộ câu trả lời đã lưu sẽ được làm mới và bạn sẽ bắt đầu lại từ câu số 1. Bạn có chắc muốn làm lại từ đầu không?",
                () => {
                    startQuiz(false);
                    addToast("Đã bắt đầu lại từ đầu bài luyện tập!", 'info');
                }
            );
        };

        const handleSubmitPractice = () => {
            const answeredCount = Object.keys(userAnswers).length;
            const totalCount = currentQuestions.length;
            showConfirm(
                "Nộp bài luyện tập?",
                `Bạn đã làm ${answeredCount}/${totalCount} câu hỏi. Bạn có chắc muốn nộp bài để xem tổng kết điểm và lời giải chi tiết ngay bây giờ không?`,
                () => {
                    processSubmit();
                }
            );
        };

        const processSubmit = () => {
            const uniqueQuestions = currentQuestions.filter((q, index, self) => index === self.findIndex((t) => (t.originalId || t.id) === (q.originalId || q.id)));
            let count = 0;
            uniqueQuestions.forEach(origQ => {
                const oid = origQ.originalId || origQ.id;
                const instances = currentQuestions.filter(q => (q.originalId || q.id) === oid);
                const lastAttempt = instances[instances.length - 1];
                if (userAnswers[lastAttempt.id] === lastAttempt.correct) {
                    count++;
                }
            });
            const finalScore = parseFloat(((count / uniqueQuestions.length) * 10).toFixed(1));
            setCorrectCount(count); setScore(finalScore);
            setSubmitted(true); setAppMode('result'); addToast("Đã ghi nhận kết quả!", 'success');

            // Cập nhật ngân hàng câu sai chỉ khi làm ở lượt thi chính thức (!isWrongReviewMode)
            const targetQuizId = quizIdTracker || 'default';
            if (!isWrongReviewMode) {
                try {
                    let currentWrong = [];
                    try {
                        const raw = localStorage.getItem('dzota_wrong_questions_' + targetQuizId);
                        if (raw) currentWrong = JSON.parse(raw) || [];
                    } catch(e) {}

                    uniqueQuestions.forEach(origQ => {
                        const oid = origQ.originalSlotId || origQ.originalId || origQ.id;
                        const instances = currentQuestions.filter(q => (q.originalSlotId || q.originalId || q.id) === oid);
                        const firstInstance = instances[0] || origQ;
                        const firstAns = firstAttempts[firstInstance.id] !== undefined ? firstAttempts[firstInstance.id] : userAnswers[firstInstance.id];
                        const isFirstTryCorrect = firstAns !== undefined && firstAns !== null && firstAns === firstInstance.correct;
                        const qKey = (firstInstance.text || '').trim();

                        if (isFirstTryCorrect) {
                            // Trả lời đúng ngay lần đầu làm bài chính thức -> Xóa khỏi danh sách câu sai
                            currentWrong = currentWrong.filter(wq => {
                                const wKey = (wq.text || '').trim();
                                const wId = wq.originalSlotId || wq.originalId || wq.id;
                                return wKey !== qKey && wId !== oid;
                            });
                        } else {
                            // Làm sai hoặc bỏ trống lần đầu -> Giữ/thêm vào danh sách câu sai
                            const alreadyInWrong = currentWrong.some(wq => {
                                const wKey = (wq.text || '').trim();
                                const wId = wq.originalSlotId || wq.originalId || wq.id;
                                return wKey === qKey || wId === oid;
                            });
                            if (!alreadyInWrong) {
                                currentWrong.push({
                                    id: firstInstance.id,
                                    originalId: oid,
                                    text: firstInstance.text,
                                    options: { ...firstInstance.options },
                                    correct: firstInstance.correct,
                                    explanation: firstInstance.explanation || ''
                                });
                            }
                        }
                    });

                    localStorage.setItem('dzota_wrong_questions_' + targetQuizId, JSON.stringify(currentWrong));
                    setWrongQuestionsList(currentWrong);
                } catch(err) {
                    console.error("Lỗi cập nhật danh sách câu sai:", err);
                }
            }

            try {
              localStorage.removeItem('dzota_quiz_session_' + (quizIdTracker || 'default'));
            } catch(e) {}
            try {
              const spent = (quizConfig.timeLimit * 60) - (timeLeft || 0);
              fetch('/api/student/history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  quizId: quizIdTracker || 'quiz',
                  quizTitle: quizConfig.title || 'Bài thi Dzota',
                  score: finalScore,
                  correctCount: count,
                  totalCount: uniqueQuestions.length,
                  timeSpent: spent > 0 ? spent : 0
                })
              }).catch(() => {});
            } catch(e) {}
        };

        // --- RENDER SECTIONS ---
        const renderHome = () => (
            <div className="min-h-screen pb-12 bg-gray-50">
                <header className="bg-white/80 backdrop-blur-xl border-b border-gray-200/50 sticky top-0 z-[40] pt-safe">
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <a href="/creator" className="flex items-center gap-2 group">
                                <div className="w-9 h-9 rounded-xl bg-white p-1 flex items-center justify-center shadow-xs border border-gray-200 group-hover:scale-105 transition-transform">
                                    <img src="/logo-dzota.png" alt="Dzota" className="w-full h-full object-contain" />
                                </div>
                                <span className="font-extrabold text-base tracking-tight text-gray-900 group-hover:text-blue-600 transition-colors">Dzota</span>
                            </a>
                            <span className="hidden sm:inline-block w-px h-5 bg-gray-200"></span>
                            <div className="flex items-center gap-2">
                                <h1 className="text-xl font-bold text-gray-900 tracking-tight">Thư viện</h1>
                                {currentUser && (
                                    <span className="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-xl font-bold flex items-center gap-1 border border-indigo-100/80">
                                        <Icons.User size={12}/> {currentUser.username}{isUserAdmin ? ' (Admin)' : ''}
                                    </span>
                                )}
                            </div>
                            <span className="hidden sm:inline-block w-px h-5 bg-gray-200"></span>
                            <div className="hidden sm:flex items-center gap-2">
                                <a 
                                    href="/dashboard" 
                                    className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition-colors shadow-xs"
                                    title="Về Dashboard quản trị"
                                >
                                    <Icons.LayoutDashboard size={14}/> Dashboard
                                </a>
                                <a 
                                    href="/tests" 
                                    className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors shadow-xs"
                                    title="Quản lý danh sách đề thi"
                                >
                                    <Icons.List size={14}/> Danh sách đề
                                </a>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-2">
                            {/* Nút Chuông Thông Báo */}
                            <button 
                                onClick={() => setShowNotifModal(true)} 
                                className="relative p-2 rounded-xl text-slate-600 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 transition-colors cursor-pointer"
                                title="Hộp thư thông báo"
                            >
                                <Icons.Bell size={20} className={unreadNotifCount > 0 ? "text-indigo-600" : ""} />
                                {unreadNotifCount > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-xs">
                                        {unreadNotifCount}
                                    </span>
                                )}
                            </button>

                            <a 
                                href="/dashboard" 
                                className="sm:hidden p-2 rounded-xl text-indigo-600 bg-indigo-50 active:bg-indigo-100 transition-colors"
                                title="Về Dashboard"
                            >
                                <Icons.LayoutDashboard size={20}/>
                            </a>
                            <a 
                                href="/tests" 
                                className="sm:hidden p-2 rounded-xl text-slate-600 bg-slate-100 active:bg-slate-200 transition-colors"
                                title="Xem danh sách đề"
                            >
                                <Icons.List size={20}/>
                            </a>
                            
                            <div className="relative">
                                <button onClick={() => setShowCreateMenu(!showCreateMenu)} className="w-10 h-10 bg-ios-blue text-white rounded-full flex items-center justify-center text-2xl shadow-lg shadow-blue-500/30 active:scale-95 transition-transform">
                                    <Icons.Plus size={22} />
                                </button>
                                {showCreateMenu && (
                                    <>
                                        <div className="fixed inset-0 z-30" onClick={() => setShowCreateMenu(false)}></div>
                                        <div className="absolute right-0 mt-3 w-64 bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden animate-pop-in z-40 origin-top-right">
                                            <button onClick={() => { setShowCreateMenu(false); handleCreateNew('standard'); }} className="w-full text-left p-4 hover:bg-gray-50 flex gap-3 border-b border-gray-50 transition-colors">
                                                <div className="bg-blue-50 p-2 rounded-xl text-ios-blue h-fit"><Icons.FileText size={20}/></div>
                                                <div>
                                                    <div className="font-bold text-gray-900 text-[14px] mb-0.5">Tạo Đề Thi Thường</div>
                                                    <div className="text-[12px] text-gray-500 leading-snug">Đề thi cố định, trắc nghiệm tiêu chuẩn.</div>
                                                </div>
                                            </button>
                                            <button onClick={() => { setShowCreateMenu(false); handleCreateNew('bank'); }} className="w-full text-left p-4 hover:bg-gray-50 flex gap-3 transition-colors">
                                                <div className="bg-emerald-50 p-2 rounded-xl text-emerald-600 h-fit"><Icons.Folder size={20}/></div>
                                                <div>
                                                    <div className="font-bold text-gray-900 text-[14px] mb-0.5">Tạo Ngân Hàng Đề</div>
                                                    <div className="text-[12px] text-gray-500 leading-snug">Kho câu hỏi để rút ngẫu nhiên sinh đề.</div>
                                                </div>
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </header>

                <main className="max-w-4xl mx-auto px-4 sm:px-6 py-8">
                    {/* Banner Đề thi Offline khi mất mạng */}
                    {offlineSavedList && offlineSavedList.length > 0 && (
                      <div className="mb-6 p-4 sm:p-5 rounded-2xl bg-gradient-to-r from-blue-500/10 via-indigo-500/10 to-emerald-500/10 border border-blue-200/80 shadow-xs text-left">

                            <a

                          value={accessPassword}

                        <div className="absolute left-3.5 top-3.5 text-[#64748B]">

                  {/* Saved in-progress session box (nếu có bài làm dở) */}
                  {(() => {
                    const savedSessionKey = 'dzota_quiz_session_' + (quizIdTracker || 'default');
                    let existingSession = null;
                    try {
                      const raw = localStorage.getItem(savedSessionKey);
                      if (raw) existingSession = JSON.parse(raw);
                    } catch(e) {}

                    if (!existingSession || existingSession.appMode !== 'taking' || !existingSession.currentQuestions?.length) return null;

                    return (
                      <div className="mb-4 p-3.5 bg-blue-50/90 border border-blue-200/80 rounded-2xl text-left flex items-center justify-between gap-3 animate-fade-in shadow-xs">
                        <div className="min-w-0">
                          <p className="text-xs font-black text-blue-900 flex items-center gap-1.5">
                            <span>🔄</span> Có bài làm dở ({Object.keys(existingSession.userAnswers || {}).length}/{existingSession.currentQuestions?.length || 0} câu đã làm)

                          <p className="text-[11px] text-blue-700/80 truncate">Đa nhiệm đã tự động lưu lại bài làm của bạn.</p>

                        <button
                          onClick={() => {
                            setCurrentQuestions(existingSession.currentQuestions);
                            setUserAnswers(existingSession.userAnswers || {});

                            setCurrentQIndex(targetQIdx);
                            setTimeLeft(existingSession.timeLeft || 0);

                          Tiếp tục

                  })()}

                      <Icons.CheckCircle size={16} className="text-emerald-600 flex-shrink-0" />
                      <span>{offlineToast}</span>

                      <div className={`w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 ${isSavedOffline ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}`}>
                        {isSavedOffline ? <Icons.Check size={16} /> : <Icons.Cloud size={16} />}

                      <div className="min-w-0">

                          {isSavedOffline && (
                            <span className="text-[10px] bg-emerald-600 text-white font-black px-1.5 py-0.2 rounded-md">
                              Đã Lưu
                            </span>
                          )}

                        <div className="text-[10px] text-slate-500 font-medium truncate">

                        </div>
                      </div>
                    </div>

                    {isSavedOffline ? (
                      <button
                        onClick={() => {
                          const targetId = quizIdTracker || 'default';
                          if (confirm('Bạn có chắc muốn xóa bản lưu trữ offline của đề thi này khỏi thiết bị?')) {
                            try {
                              localStorage.removeItem('dzota_offline_quiz_' + targetId);
                              setIsSavedOffline(false);
                              refreshOfflineSavedList();
                              setOfflineToast('Đã xóa dữ liệu đề thi offline thành công!');
                              setTimeout(() => setOfflineToast(null), 4000);
                            } catch (e) {}
                          }
                        }}
                        type="button"
                        className="px-2.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs flex items-center gap-1 transition cursor-pointer border border-rose-200 flex-shrink-0"
                        title="Xóa đề đã lưu trữ offline"
                      >
                        <Icons.Trash2 size={13} />
                        <span>Xóa lưu trữ</span>
                      </button>

                      <button
                        onClick={() => {
                          const targetId = quizIdTracker || 'default';
                          try {
                            const rawQuestions = parsedQuestions.map(slot => (slot.variants && slot.variants[0]) ? slot.variants[0] : slot);
                            const payload = {
                              test: {
                                id: targetId,
                                title: quizConfig.title,
                                timeLimit: quizConfig.timeLimit,
                                mode: quizConfig.mode,
                                category: quizConfig.category,
                                questions: rawQuestions,
                                config: quizConfig
                              },
                              savedAt: Date.now()
                            };
                            localStorage.setItem('dzota_offline_quiz_' + targetId, JSON.stringify(payload));
                            setIsSavedOffline(true);
                            refreshOfflineSavedList();

                            // Lưu đệm HTML và tài nguyên web để mở lại link hoặc F5 khi không có internet
                            if ('caches' in window) {
                              caches.open('dzota-quiz-offline-v2').then(async (cache) => {
                                try { await cache.add(window.location.href); } catch (e) {}
                                try { await cache.add('/'); } catch (e) {}
                                try { await cache.add('/index.html'); } catch (e) {}
                                const resources = Array.from(document.querySelectorAll('script[src], link[rel="stylesheet"]'))
                                  .map(el => el.src || el.href)
                                  .filter(Boolean);
                                resources.forEach(url => cache.add(url).catch(() => {}));
                              }).catch(() => {});
                            }
                            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                              navigator.serviceWorker.controller.postMessage({
                                type: 'CACHE_OFFLINE_QUIZ',
                                url: window.location.href
                              });
                            }

                            setOfflineToast('⚡ Đã lưu đề vào máy! Bạn có thể mở link hoặc F5 làm bài bất kỳ lúc nào kể cả khi ngắt toàn bộ kết nối mạng.');
                            setTimeout(() => setOfflineToast(null), 6000);

                          `}>{optKey}</span>
                          <span className="text-[15px] sm:text-[16px] text-[#3c4043] leading-snug font-normal group-hover:text-[#202124]"><MathText text={q.options[optKey]} /></span>

                          </div>
                          <div className="min-w-0 flex-1">
                            <div className="font-black text-white text-xs sm:text-sm leading-tight truncate drop-shadow-xs">{quizConfig.title || 'Luyện Tập'}</div>

                              <span>Chế độ luyện tập</span>

                            <span className="text-cyan-200 hidden xs:inline">Câu</span>
                            <span className="text-white font-extrabold">{currentQIndex + 1}/{currentQuestions.length}</span>

                    {/* Main Content Area - Scrollable ONLY when content overflows (flex-1 overflow-y-auto) */}

                             <Icons.ChevronLeft size={15} />
                             <span className="hidden xs:inline">Lùi lại</span>

        const renderResult = () => {
           const uniqueQuestions = currentQuestions.filter((q, index, self) => index === self.findIndex((t) => (t.originalId || t.id) === (q.originalId || q.id)));
           const filtered = uniqueQuestions.filter(q => {
             const baseId = q.originalId || q.id, isCorrect = userAnswers[baseId] === q.correct;
             if (resultFilter === 'correct') return isCorrect; if (resultFilter === 'incorrect') return !isCorrect; return true;
           });

           return (
             <div className="flex flex-col min-h-screen bg-ios-bg p-4 sm:p-6 items-center font-sans pb-10">
                <div className="bg-white p-8 rounded-[32px] shadow-ios max-w-2xl w-full text-center animate-slide-up mt-4 mb-6">

                   <div className="text-[80px] font-extrabold text-black leading-none mb-2 tracking-tight">{score}<span className="text-[32px] text-gray-300">/10</span></div>
                   <div className="flex justify-center gap-3 mt-6 mb-8">
                      <div className="bg-green-50 text-ios-green px-4 py-2 rounded-2xl font-bold text-[15px]">Đúng {correctCount}</div>
                      <div className="bg-red-50 text-ios-red px-4 py-2 rounded-2xl font-bold text-[15px]">Sai {uniqueQuestions.length - correctCount}</div>

                         addToast('Chúc mừng! Bạn không có câu sai nào cần ôn tập.', 'success');

                       }
                       setShowMistakeReviewModal(true);
                     }}

                   >
                     <Icons.RotateCcw size={18} className="text-amber-600" />
                     <span>Ôn Lại Câu Sai</span>
                     <span className={`px-2.5 py-0.5 rounded-full text-xs font-extrabold ${
                       wrongQuestionsList && wrongQuestionsList.length > 0
                         ? 'bg-amber-500 text-white shadow-xs'

                     }`}>
                       {wrongQuestionsList ? wrongQuestionsList.length : 0} câu
                     </span>
                   </button>
                </div>

                <div className="max-w-2xl w-full animate-slide-up">
                    <div className="flex bg-gray-200/60 p-1 rounded-xl mb-6 shadow-inner">
                        {['all', 'correct', 'incorrect'].map(f => (
                            <button key={f} onClick={() => setResultFilter(f)} className={`flex-1 py-2 text-[14px] font-semibold rounded-lg transition-all ${resultFilter === f ? 'bg-white shadow-sm text-black' : 'text-gray-500'}`}>{f === 'all' ? 'Tất cả' : (f === 'correct' ? 'Đúng' : 'Sai')}</button>
                        ))}
                    </div>
                    <div className="space-y-4">
                      {filtered.map((q, i) => {
                        const baseId = q.originalId || q.id, userAnswer = userAnswers[baseId], isCorrect = userAnswer === q.correct, examIndex = uniqueQuestions.findIndex(item => (item.originalId || item.id) === baseId) + 1; 
                        return (
                          <div key={baseId} className="bg-white p-5 rounded-[24px] shadow-ios-sm relative overflow-hidden">
                             <div className={`absolute top-0 left-0 w-1.5 h-full ${isCorrect ? 'bg-ios-green' : 'bg-ios-red'}`}></div>
                             <div className="flex items-start justify-between gap-3 mb-3">
                                <div className="flex gap-2 items-start flex-1">
                                   <span className={`font-bold flex-shrink-0 ${isCorrect ? "text-ios-green" : "text-ios-red"}`}>Câu {examIndex}:</span>
                                   <span className="text-[15px] font-medium text-black leading-snug whitespace-pre-line w-full"><MathText text={q.text} /></span>
                                </div>
                                <button
                                  onClick={() => handleAskTeacher(q)}
                                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-gradient-to-r from-[#1a73e8] to-[#1557b0] text-white font-bold text-xs shadow-xs hover:shadow-md hover:scale-[1.02] active:scale-[0.98] transition-all cursor-pointer flex-shrink-0"
                                  title="Hỏi giảng viên AI giải thích câu này"
                                >
                                  <Icons.HelpCircle size={14} />
                                  <span>Giải thích (?)</span>
                                </button>
                             </div>

                                <div className="question-image-container flex flex-col gap-2 mb-4">{q.images.map((src, i) => <img key={i} src={getDirectImageUrl(src)} alt="Minh họa"/>)}</div>
                             )}
                             <div className="space-y-2 mt-3">
                               {['A', 'B', 'C', 'D', 'E', 'F', 'G'].map(optKey => (
                                  q.options[optKey] && (
                                    <div key={optKey} className={`p-2.5 rounded-xl border flex items-center transition-colors ${optKey === q.correct ? 'bg-green-50 border-ios-green' : ''} ${optKey === userAnswer && optKey !== q.correct ? 'bg-red-50 border-ios-red' : ''} ${optKey !== userAnswer && optKey !== q.correct ? 'bg-gray-50 border-gray-100 opacity-60' : ''}`}>
                                       <span className={`w-6 h-6 flex-shrink-0 flex items-center justify-center rounded-full text-[12px] font-bold mr-3 border ${optKey === q.correct ? 'bg-ios-green border-ios-green text-white' : ''} ${optKey === userAnswer && optKey !== q.correct ? 'bg-ios-red border-ios-red text-white' : ''} ${optKey !== userAnswer && optKey !== q.correct ? 'bg-white border-gray-300 text-gray-500' : ''}`}>{optKey}</span>
                                       <span className={`text-[14px] ${optKey === q.correct || optKey === userAnswer ? 'text-black font-medium' : 'text-gray-600'}`}><MathText text={q.options[optKey]} /></span>

                                     </div>
                                  )
                                ))}
                             </div>
                          </div>
                        )

                                <div className="text-center py-16 text-gray-400 text-sm">

                                    <p className="font-bold text-gray-600">Hộp thư trống</p>
                                    <p className="text-xs text-gray-400 mt-1">Chưa có thông báo nào từ Quản trị viên.</p>
                                </div>
                            ) : (
                                userNotifications.map(n => (
                                    <div key={n.id} className={`p-4 rounded-2xl border transition-all ${!n.isRead ? 'bg-indigo-50/50 border-indigo-200 shadow-xs' : 'bg-white border-gray-100'}`}>
                                        <div className="flex justify-between items-start gap-2 mb-1.5">
                                            <h4 className="font-bold text-gray-900 text-sm flex items-center gap-1.5">
                                                {!n.isRead && <span className="w-2 h-2 rounded-full bg-indigo-600 flex-shrink-0 animate-pulse"/>}
                                                {n.title}
                                            </h4>

                      <div>
                        <h3 className="font-extrabold text-slate-800 text-lg sm:text-xl flex items-center gap-2">
                          <span>Chuẩn Hóa Markdown Dzota</span>
                          <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">Word 14pt Standard</span>
                        </h3>
                        <p className="text-xs text-slate-500">Chuyển định dạng từ ChatGPT, Gemini, Claude sang đề thi chuẩn Word và tự động nhận diện đáp án</p>
                      </div>
                    </div>
                    <button 
                      onClick={() => setShowDzotaModal(false)}
                      className="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors cursor-pointer"
                    >
                      <Icons.X size={20} />
                    </button>
                  </div>

                  {/* Modal Body: 2 Columns */}
                  <div className="p-4 sm:p-6 flex-1 min-h-0 flex flex-col lg:flex-row gap-5 overflow-y-auto custom-scrollbar">
                    {/* Cột 1: Dữ liệu đầu vào */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 flex flex-col w-full lg:w-1/2 overflow-hidden transition-all hover:shadow-md min-h-[380px]">
                      <div className="px-5 py-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50/70 shrink-0">
                        <h2 className="font-bold text-slate-800 flex items-center gap-2 text-sm sm:text-base">
                          <div className="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center"><Icons.Keyboard size={16}/></div>
                          Dữ liệu đầu vào
                        </h2>
                        <button 
                          onClick={clearDzotaInput} 
                          className="text-xs font-semibold text-slate-400 hover:text-rose-600 transition-colors flex items-center gap-1 px-2.5 py-1.5 rounded-lg hover:bg-rose-50 cursor-pointer"
                        >
                          <Icons.Trash size={14}/> Xóa sạch
                        </button>
                      </div>
                      <div className="p-5 flex-grow flex flex-col gap-4 min-h-0">
                        <textarea 
                          id="dzota-input-text" 
                          value={dzotaInputText}
                          onChange={(e) => setDzotaInputText(e.target.value)}
                          className="w-full flex-grow p-4 border-2 border-slate-100 rounded-2xl focus:ring-0 focus:border-indigo-400 outline-none resize-none font-mono text-xs sm:text-sm shadow-inner text-slate-700 transition-colors leading-relaxed bg-slate-50 focus:bg-white custom-scrollbar min-h-[220px]" 
                          placeholder="Dán văn bản Markdown từ AI vào đây... (Ví dụ:&#10;### Câu 1: Cho hàm số f(x)...&#10;A. 1&#10;B. 2&#10;C. 3&#10;D. 4&#10;Đáp án: A&#10;Lời giải: Ta có...)"
                        ></textarea>
                        <button 
                          onClick={handleProcessDzotaText} 
                          className="relative shrink-0 w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-[0_8px_20px_rgb(79,70,229,0.25)] transition-all active:scale-[0.98] flex items-center justify-center gap-2.5 cursor-pointer"
                        >
                          <Icons.Wand2 size={18} /> <span className="text-base">Xử lý định dạng ngay</span>
                        </button>
                      </div>
                    </div>

                    {/* Cột 2: Kết quả chuẩn Word */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 flex flex-col w-full lg:w-1/2 overflow-hidden transition-all hover:shadow-md min-h-[380px]">
                      <div className="px-5 py-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50/70 shrink-0">
                        <h2 className="font-bold text-slate-800 flex items-center gap-2 text-sm sm:text-base">
                          <div className="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center"><Icons.FileCheck size={16}/></div>
                          Kết quả chuẩn Word
                        </h2>
                        <div className="flex items-center gap-2">
                          <button 
                            onClick={copyDzotaToWord} 
                            className="text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition-colors flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-emerald-200 cursor-pointer"
                          >
                            <Icons.Copy size={14}/> Sao chép Rich-Text
                          </button>
                          <button 
                            onClick={applyDzotaToEditor} 
                            className="text-xs font-bold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition-colors flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-indigo-200 cursor-pointer"
                            title="Chèn thẳng vào khung soạn thảo TinyMCE bên dưới"
                          >
                            <Icons.ArrowDownToLine size={14}/> Chèn vào soạn thảo
                          </button>
                        </div>
                      </div>
                      <div className="p-5 flex-grow flex flex-col gap-4 min-h-0">
                        {dzotaPreviewHtml ? (
                          <div 
                            id="dzota-preview-box" 
                            contentEditable="true" 
                            dangerouslySetInnerHTML={{ __html: dzotaPreviewHtml }}
                            className="w-full flex-grow p-6 border-2 border-slate-100 rounded-2xl outline-none overflow-y-auto custom-scrollbar focus:border-emerald-400 transition-colors min-h-[280px]"
                          />
                        ) : (
                          <div 
                            id="dzota-preview-box" 
                            contentEditable="true" 
                            className="w-full flex-grow p-6 border-2 border-slate-100 rounded-2xl outline-none overflow-y-auto custom-scrollbar focus:border-emerald-400 transition-colors min-h-[280px]"
                          >
                            <div className="text-slate-300 font-sans text-sm text-center py-20 pointer-events-none flex flex-col items-center">
                              <Icons.FileSignature size={48} className="mb-3 opacity-40 text-slate-400"/>
                              <span>Nhấn "Xử lý định dạng ngay" để xem trước kết quả chuẩn Word tại đây...</span>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                  
                  {/* Modal Footer */}
                  <div className="px-6 py-3.5 bg-white border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500">
                    <div className="flex items-center gap-2">
                      <Icons.Info size={14} className="text-indigo-500" />
                      <span>Đáp án đúng sẽ được tự động <b>In Đậm</b> và hiển thị màu đỏ để trình soạn thảo TinyMCE tự động nhận diện.</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <button 
                        onClick={() => setShowDzotaModal(false)}
                        className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-medium transition cursor-pointer"
                      >
                        Đóng
                      </button>
                      {dzotaPreviewHtml && (
                        <button 
                          onClick={applyDzotaToEditor}
                          className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold transition flex items-center gap-1.5 shadow-sm cursor-pointer"
                        >
                          <Icons.ArrowDownToLine size={14} /> Chèn vào bài thi ngay
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Modal 1: Hộp thoại Ôn Lại Câu Sai */}
            {showMistakeReviewModal && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 animate-fade-in">
                <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden animate-slide-up">
                  {/* Header */}
                  <div className="px-5 sm:px-6 py-4 bg-gradient-to-r from-amber-50 to-orange-50 border-b border-amber-100 flex items-center justify-between shrink-0">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 text-white flex items-center justify-center shadow-md shadow-amber-500/20">
                        <Icons.RotateCcw size={20} />
                      </div>
                      <div>
                        <h3 className="font-extrabold text-slate-800 text-base sm:text-lg flex items-center gap-2">
                          <span>Ôn Lại Câu Sai</span>
                          <span className="text-xs bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full font-bold">
                            {wrongQuestionsList.length} câu
                          </span>
                        </h3>
                        <p className="text-xs text-slate-500 truncate max-w-[260px] sm:max-w-xs">{quizConfig.title || 'Bài thi'}</p>
                      </div>
                    </div>
                    <button
                      onClick={() => setShowMistakeReviewModal(false)}
                      className="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition cursor-pointer"
                    >
                      <Icons.X size={18} />
                    </button>
                  </div>

                  {/* Body */}
                  <div className="p-5 overflow-y-auto space-y-4 text-xs sm:text-sm text-slate-600">
                    <div className="p-3.5 rounded-2xl bg-amber-50/70 border border-amber-200/80 text-amber-900 space-y-1.5 leading-relaxed">
                      <div className="font-bold flex items-center gap-1.5 text-amber-800">
                        <Icons.HelpCircle size={15} />
                        <span>Quy tắc ôn luyện thông minh:</span>
                      </div>
                      <p className="text-[12px] text-amber-800/90 leading-relaxed">
                        Các câu hỏi trong danh sách này <strong>chỉ biến mất</strong> khi bạn làm lượt thi chính thức ở phần <strong>"Bắt Đầu Làm Bài"</strong> và trả lời đúng ngay lần đầu tiên.
                      </p>
                    </div>

                    <div className="border border-slate-200 rounded-2xl overflow-hidden divide-y divide-slate-100">
                      <div className="px-4 py-2.5 bg-slate-50 font-bold text-slate-700 text-xs flex justify-between items-center">
                        <span>Danh sách câu hỏi cần củng cố</span>
                        <span className="text-slate-400 font-normal">{wrongQuestionsList.length} câu</span>
                      </div>
                      <div className="max-h-56 overflow-y-auto divide-y divide-slate-100 p-1">
                        {wrongQuestionsList.map((q, idx) => (
                          <div key={idx} className="p-2.5 text-xs text-slate-700 hover:bg-slate-50 rounded-xl transition flex gap-2 items-start">
                            <span className="w-5 h-5 rounded-full bg-rose-100 text-rose-700 font-bold flex items-center justify-center shrink-0 text-[11px] mt-0.5">
                              {idx + 1}
                            </span>
                            <span className="line-clamp-2 leading-relaxed">
                              {q.text || q.question || 'Câu hỏi'}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Footer */}
                  <div className="p-4 sm:p-5 bg-slate-50 border-t border-slate-100 flex flex-col sm:flex-row gap-2.5 items-center justify-between shrink-0">
                    <button
                      type="button"
                      onClick={handleRequestMistakeAnalysis}
                      className="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-indigo-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95"
                    >
                      <Icons.Wand2 size={16} />
                      <span>✨ Phân tích lỗi sai với AI</span>
                    </button>

                    <button
                      type="button"
                      onClick={handleStartWrongQuestionsPractice}
                      className="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs sm:text-sm shadow-md shadow-amber-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95"
                    >
                      <Icons.Play size={15} fill="currentColor" />
                      <span>Bắt đầu ôn luyện ngay</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal 2: Phân Tích Lỗi Sai Với AI */}
            {showMistakeAnalysisModal && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 animate-fade-in">
                <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-2xl max-h-[92vh] flex flex-col overflow-hidden animate-slide-up">
                  {/* Header */}
                  <div className="px-5 sm:px-6 py-4 bg-gradient-to-r from-indigo-50 via-purple-50 to-pink-50 border-b border-indigo-100 flex items-center justify-between shrink-0">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/20">
                        <Icons.Wand2 size={20} />
                      </div>
                      <div>
                        <h3 className="font-extrabold text-slate-800 text-base sm:text-lg flex items-center gap-2">
                          <span>Giảng Viên AI - Phân Tích Lỗi Sai</span>
                        </h3>
                        <p className="text-xs text-indigo-700 font-medium">Tổng hợp kiến thức trọng tâm cho {wrongQuestionsList.length} câu hỏi sai</p>
                      </div>
                    </div>
                    <button
                      onClick={() => setShowMistakeAnalysisModal(false)}
                      className="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition cursor-pointer"
                    >
                      <Icons.X size={18} />
                    </button>
                  </div>

                  {/* Body */}
                  <div className="p-5 sm:p-6 flex-1 overflow-y-auto space-y-4">
                    {isAnalyzingMistakes ? (
                      <div className="py-12 flex flex-col items-center justify-center text-center space-y-3">
                        <div className="w-12 h-12 rounded-2xl bg-indigo-50 border border-indigo-200 flex items-center justify-center animate-spin">
                          <Icons.RotateCcw size={24} className="text-indigo-600" />
                        </div>
                        <h4 className="font-bold text-slate-800 text-sm sm:text-base">Đang tổng hợp kiến thức từ Giảng viên AI...</h4>
                        <p className="text-xs text-slate-500 max-w-sm">
                          Hệ thống đang phân tích các câu hỏi bạn làm sai, cô đọng kiến thức then chốt để giúp bạn làm đúng 100% trong lần ôn tập này.
                        </p>
                      </div>
                    ) : (
                      <div className="space-y-4">
                        <div className="p-4 rounded-2xl bg-indigo-50/50 border border-indigo-100 text-indigo-900 text-xs flex items-center justify-between">
                          <span>💡 Hãy đọc kỹ phần tóm tắt cốt lõi bên dưới trước khi bắt đầu ôn luyện.</span>
                          <span className="font-bold shrink-0 ml-2">{wrongQuestionsList.length} câu hỏi</span>
                        </div>
                        <div className="bg-slate-50/80 p-4 sm:p-5 rounded-2xl border border-slate-200 text-xs sm:text-sm leading-relaxed max-h-[50vh] overflow-y-auto">
                          {renderFormattedMarkdown(mistakeAnalysisText)}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Footer */}
                  <div className="px-5 sm:px-6 py-4 bg-slate-50 border-t border-slate-100 flex flex-wrap gap-2.5 items-center justify-between shrink-0">
                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={handleCopyMistakeAnalysis}
                        disabled={isAnalyzingMistakes || !mistakeAnalysisText}
                        className="px-3.5 py-2 rounded-xl border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold transition flex items-center gap-1.5 cursor-pointer disabled:opacity-40"
                        title="Sao chép nội dung phân tích"
                      >
                        <Icons.Copy size={14} />
                        <span>Sao chép</span>
                      </button>

                      <button
                        type="button"
                        onClick={handleSaveMistakeAnalysisToAccount}
                        disabled={isAnalyzingMistakes || !mistakeAnalysisText || mistakeAnalysisSaved}
                        className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer ${
                          mistakeAnalysisSaved
                            ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                            : 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200'
                        } disabled:opacity-50`}
                        title="Lưu bài phân tích này vào tab Sổ tay lỗi sai"
                      >
                        <Icons.Bookmark size={14} />
                        <span>{mistakeAnalysisSaved ? '✓ Đã lưu vào sổ tay' : 'Lưu vào sổ tay'}</span>
                      </button>
                    </div>

                    <button
                      type="button"
                      onClick={() => {
                        setShowMistakeAnalysisModal(false);
                        handleStartWrongQuestionsPractice();
                      }}
                      disabled={isAnalyzingMistakes}
                      className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold text-xs sm:text-sm shadow-md shadow-indigo-500/20 transition-all flex items-center gap-2 cursor-pointer active:scale-95 disabled:opacity-50"
                    >
                      <span>Đóng & Vào làm bài</span>
                      <Icons.ArrowRight size={15} />
                    </button>
                  </div>
                </div>
              </div>
            )}

            {appMode === 'home' && renderHome()}
            {appMode === 'bank_builder' && renderBankBuilder()}
            {appMode === 'editor' && renderEditor()}
            {appMode === 'blocked' && renderBlocked()}
            {appMode === 'access_denied' && renderAccessDenied()}
            {appMode === 'entry' && renderEntry()}
            {appMode === 'taking' && renderTaking()}
            {appMode === 'result' && renderResult()}

            {appMode !== 'taking' && appMode !== 'entry' && (
              <div className="w-full text-center py-8">
                <p className="text-[11px] font-extrabold text-gray-400 uppercase tracking-[0.3em] select-none">
                  Bản quyền thuộc về <span className="font-bold text-gray-800">Nhật Duy Y Khoa K26</span>
                </p>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
